<!-- ========================================================================= -->
<!-- KEHADIRAN SAYA (BUKU PRESENSI DIGITAL SISWA)                              -->
<!-- Migrasi 100% Identik dari resources/views/siswa/kehadiran.blade.php       -->
<!-- ========================================================================= -->

<div x-cloak x-data="kehadiranSayaData()" x-init="initData()" class="space-y-6">

    <!-- Loading State -->
    <div x-show="loading" class="flex flex-col items-center justify-center py-20 bg-white rounded-2xl border border-slate-100 shadow-sm">
        <svg class="animate-spin h-8 w-8 text-blue-600 mb-3" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <p class="text-xs font-bold text-slate-500">Memuat data presensi siswa...</p>
    </div>

    <!-- Error State -->
    <div x-show="!loading && errorMessage" class="bg-red-50 text-red-700 p-4 rounded-2xl border border-red-200 text-xs font-bold flex items-center gap-3">
        <svg class="w-5 h-5 text-red-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span x-text="errorMessage"></span>
    </div>

    <div x-show="!loading && !errorMessage" class="space-y-6">

        <!-- A. IDENTITAS SISWA & MATA PELAJARAN -->
        <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-5 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <div class="flex items-center gap-2 mb-1.5">
                    <span class="text-[10px] font-extrabold uppercase tracking-wider bg-blue-100 text-blue-800 px-2.5 py-0.5 rounded-md border border-blue-200" x-text="`Kelas: ${data.siswa.nama_kelas}`"></span>
                    <span class="text-[10px] font-extrabold uppercase tracking-wider bg-slate-100 text-slate-700 px-2.5 py-0.5 rounded-md border border-slate-200" x-text="`NIS: ${data.siswa.nis}`"></span>
                </div>
                <h1 class="text-xl font-black text-slate-800 tracking-tight" x-text="data.siswa.nama"></h1>
                <p class="text-xs text-slate-500 font-medium">Buku Catatan Kehadiran & Presensi Digital Siswa</p>
            </div>
            <div class="bg-blue-50 border border-blue-200 px-4 py-2.5 rounded-2xl flex items-center gap-3 w-full md:w-auto">
                <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center text-xl flex-shrink-0 font-bold shadow-sm">
                    💻
                </div>
                <div>
                    <span class="text-[10px] text-blue-600 font-bold uppercase block">Mata Pelajaran</span>
                    <span class="text-sm font-black text-blue-900 block">Informatika</span>
                </div>
            </div>
        </div>

        <!-- B. REKAP KEHADIRAN (6 KOTAK STATISTIK) -->
        <div>
            <h2 class="text-xs font-black text-slate-700 uppercase tracking-wider mb-3 flex items-center gap-2">
                <span>📊</span> Rekap Kehadiran Presensi
            </h2>
            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
                
                <!-- Hadir (Hijau) -->
                <div class="bg-emerald-50 border border-emerald-200/80 rounded-2xl p-4 text-center">
                    <span class="text-[11px] font-bold text-emerald-700 uppercase tracking-wider block mb-1">Hadir</span>
                    <span class="text-3xl font-black text-emerald-800 block" x-text="data.rekap.hadir"></span>
                    <span class="text-[10px] text-emerald-600 font-semibold mt-1 block">Pertemuan</span>
                </div>

                <!-- Sakit (Kuning) -->
                <div class="bg-amber-50 border border-amber-200/80 rounded-2xl p-4 text-center">
                    <span class="text-[11px] font-bold text-amber-700 uppercase tracking-wider block mb-1">Sakit</span>
                    <span class="text-3xl font-black text-amber-800 block" x-text="data.rekap.sakit"></span>
                    <span class="text-[10px] text-amber-600 font-semibold mt-1 block">Hari</span>
                </div>

                <!-- Izin (Biru) -->
                <div class="bg-blue-50 border border-blue-200/80 rounded-2xl p-4 text-center">
                    <span class="text-[11px] font-bold text-blue-700 uppercase tracking-wider block mb-1">Izin</span>
                    <span class="text-3xl font-black text-blue-800 block" x-text="data.rekap.izin"></span>
                    <span class="text-[10px] text-blue-600 font-semibold mt-1 block">Hari</span>
                </div>

                <!-- Dispen (Ungu) -->
                <div class="bg-purple-50 border border-purple-200/80 rounded-2xl p-4 text-center">
                    <span class="text-[11px] font-bold text-purple-700 uppercase tracking-wider block mb-1">Dispen</span>
                    <span class="text-3xl font-black text-purple-800 block" x-text="data.rekap.dispen"></span>
                    <span class="text-[10px] text-purple-600 font-semibold mt-1 block">Hari</span>
                </div>

                <!-- Alpa (Merah) -->
                <div class="bg-rose-50 border border-rose-200/80 rounded-2xl p-4 text-center">
                    <span class="text-[11px] font-bold text-rose-700 uppercase tracking-wider block mb-1">Alpa</span>
                    <span class="text-3xl font-black text-rose-800 block" x-text="data.rekap.alpa"></span>
                    <span class="text-[10px] text-rose-600 font-semibold mt-1 block">Hari</span>
                </div>

                <!-- Total Presensi (Slate) -->
                <div class="bg-slate-50 border border-slate-200/80 rounded-2xl p-4 text-center col-span-2 sm:col-span-1">
                    <span class="text-[11px] font-bold text-slate-600 uppercase tracking-wider block mb-1">Total Presensi</span>
                    <span class="text-3xl font-black text-slate-800 block" x-text="data.rekap.total"></span>
                    <span class="text-[10px] text-slate-500 font-semibold mt-1 block">Tercatat</span>
                </div>

            </div>
        </div>

        <!-- C. TABEL RIWAYAT KEHADIRAN (READ-ONLY) -->
        <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
            <div class="p-4 bg-slate-50/60 border-b border-slate-200 flex justify-between items-center">
                <h3 class="text-xs font-black text-slate-800 uppercase tracking-wider flex items-center gap-2">
                    <span>📋</span> Detail Riwayat Kehadiran
                </h3>
                <span class="text-[10px] font-bold bg-slate-200 text-slate-700 px-2.5 py-0.5 rounded-full">Buku Digital (Read-Only)</span>
            </div>

            <template x-if="!data.riwayat || data.riwayat.length === 0">
                <div class="p-12 text-center text-slate-400 text-xs italic">
                    Belum ada riwayat kehadiran yang tercatat untuk akun Anda.
                </div>
            </template>

            <template x-if="data.riwayat && data.riwayat.length > 0">
                <div class="overflow-x-auto">
                    <table class="w-full text-xs text-left border-collapse">
                        <thead class="bg-slate-50 text-slate-500 uppercase font-black tracking-wider text-[10px] border-b border-slate-200">
                            <tr>
                                <th class="py-3 px-4 w-12 text-center">No</th>
                                <th class="py-3 px-4 min-w-[130px]">Tanggal</th>
                                <th class="py-3 px-4 min-w-[110px] text-center">Pertemuan</th>
                                <th class="py-3 px-4 min-w-[110px] text-center">Status Presensi</th>
                                <th class="py-3 px-4 min-w-[120px] text-center">Nilai Keaktifan</th>
                                <th class="py-3 px-4 min-w-[200px]">Catatan Pembelajaran</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            <template x-for="r in data.riwayat" :key="r.id">
                                <tr class="hover:bg-slate-50/50">
                                    <td class="py-3.5 px-4 text-center text-slate-400 font-mono" x-text="r.no"></td>
                                    <td class="py-3.5 px-4 font-bold text-slate-800" x-text="r.tanggal"></td>
                                    <td class="py-3.5 px-4 text-center font-semibold text-slate-600" x-text="`Ke-${r.pertemuan}`"></td>
                                    <td class="py-3.5 px-4 text-center">
                                        <span :class="{
                                            'bg-emerald-100 text-emerald-800 border-emerald-200': r.status === 'hadir',
                                            'bg-amber-100 text-amber-800 border-amber-200': r.status === 'sakit',
                                            'bg-blue-100 text-blue-800 border-blue-200': r.status === 'izin',
                                            'bg-purple-100 text-purple-800 border-purple-200': r.status === 'dispen',
                                            'bg-rose-100 text-rose-800 border-rose-200': r.status === 'alpha' || r.status === 'alpa'
                                        }" class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase border" x-text="r.status"></span>
                                    </td>
                                    <td class="py-3.5 px-4 text-center font-bold text-indigo-700" x-text="r.nilai_keaktifan || '-'"></td>
                                    <td class="py-3.5 px-4 text-slate-500 font-medium text-[11px]" x-text="r.catatan || '-'"></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>
        </div>

    </div>

</div>

<!-- LOGIC ALPINE JS -->
<script>
function kehadiranSayaData() {
    return {
        loading: true,
        errorMessage: '',
        data: {
            siswa: { id: null, nis: '', nama: '', nama_kelas: '-' },
            rekap: { hadir: 0, sakit: 0, izin: 0, dispen: 0, alpa: 0, total: 0 },
            riwayat: []
        },

        initData() {
            var token = localStorage.getItem('spensa_token') || (new URLSearchParams(window.location.search)).get('token') || '';
            if (token) {
                localStorage.setItem('spensa_token', token);
            } else {
                this.loading = false;
                this.errorMessage = 'Sesi login tidak ditemukan. Silakan login kembali.';
                return;
            }

            google.script.run
                .withSuccessHandler((response) => {
                    this.loading = false;
                    if (response && response.status === 'success') {
                        this.data = response.data;
                    } else {
                        this.errorMessage = response ? response.message : 'Gagal memuat rekap kehadiran';
                    }
                })
                .withFailureHandler((error) => {
                    this.loading = false;
                    this.errorMessage = error.message || 'Terjadi kesalahan sistem';
                })
                .getKehadiranSaya(token);
        }
    }
}
</script>
