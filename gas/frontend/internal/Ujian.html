<!-- Ujian.html - Kelola Ujian Harian (Guru Side) -->
<div x-data="ujianGuruData()" x-init="initData()" class="space-y-6">

    <!-- NOTIFIKASI TOAST / BANNER -->
    <template x-if="notification.show">
        <div :class="notification.type === 'success' ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-red-50 border-red-200 text-red-800'" class="mb-4 flex items-center gap-3 border p-4 rounded-2xl shadow-sm transition-all duration-300">
            <div :class="notification.type === 'success' ? 'bg-emerald-500' : 'bg-red-500'" class="w-7 h-7 rounded-full flex items-center justify-center flex-shrink-0 shadow-sm">
                <svg x-show="notification.type === 'success'" class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                <svg x-show="notification.type === 'error'" class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </div>
            <p class="font-semibold text-sm" x-text="notification.message"></p>
            <button @click="notification.show = false" class="ml-auto text-current opacity-50 hover:opacity-100 transition-opacity">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
    </template>

    <!-- ========================================================================= -->
    <!-- VIEW 1: DAFTAR UJIAN HARIAN (LIST VIEW) -->
    <!-- ========================================================================= -->
    <template x-if="viewMode === 'list'">
        <div class="space-y-5">
            <!-- Header Banner -->
            <div class="flex items-start gap-4 bg-gradient-to-r from-blue-900 to-indigo-900 rounded-2xl p-5 shadow-xl relative overflow-hidden">
                <div class="w-12 h-12 bg-blue-500/30 border border-blue-400/30 rounded-2xl flex items-center justify-center flex-shrink-0 shadow-lg backdrop-blur-sm">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                    </svg>
                </div>
                <div class="relative flex-1 min-w-0">
                    <h2 class="text-white font-bold text-base leading-tight">Kelola Ujian Harian (CBT)</h2>
                    <p class="text-blue-200 text-xs mt-1 leading-relaxed">
                        Buat paket soal pilihan ganda & essay, atur token masuk, pilih target kelas, monitor aktivitas siswa, dan kelola koreksi nilai.
                    </p>
                </div>
            </div>

            <!-- Table Card -->
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5">
                <!-- Filter & Action Bar -->
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-3 pb-3 border-b border-slate-100">
                    <div class="flex items-center gap-2">
                        <label class="text-xs font-bold text-slate-600">Filter Status:</label>
                        <select x-model="statusFilter" @change="fetchList()" class="bg-slate-50 border border-slate-300 rounded-xl px-3 py-1.5 text-xs font-semibold text-slate-700 cursor-pointer focus:ring-2 focus:ring-blue-500">
                            <option value="">Semua Status</option>
                            <option value="draft">Draft</option>
                            <option value="aktif">Aktif</option>
                            <option value="selesai">Selesai</option>
                        </select>
                    </div>
                    <button @click="openCreateForm()" class="bg-blue-600 hover:bg-blue-700 active:scale-95 text-white flex items-center gap-1.5 shadow-md shadow-blue-500/20 text-xs py-2 px-3.5 rounded-xl font-bold transition-all">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        Buat Ujian Baru
                    </button>
                </div>

                <!-- Loading State -->
                <div x-show="loadingList" class="py-12 text-center">
                    <svg class="animate-spin h-8 w-8 text-blue-600 mx-auto mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    <p class="text-xs text-slate-500 font-medium">Memuat paket ujian...</p>
                </div>

                <!-- Table -->
                <div x-show="!loadingList" class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 text-slate-700 text-xs uppercase font-extrabold border-b border-slate-200">
                                <th class="py-3 px-4 w-12 text-center">No</th>
                                <th class="py-3 px-4">Judul Ujian</th>
                                <th class="py-3 px-4">Bab</th>
                                <th class="py-3 px-4">Tanggal</th>
                                <th class="py-3 px-4">Durasi</th>
                                <th class="py-3 px-4">Kelas Peserta</th>
                                <th class="py-3 px-4 text-center">Status</th>
                                <th class="py-3 px-4 text-center">Token</th>
                                <th class="py-3 px-4 text-center w-52">Aksi</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100 text-xs font-medium">
                            <template x-for="(u, idx) in ujians" :key="u.id">
                                <tr class="hover:bg-slate-50/80 transition-colors">
                                    <td class="py-3 px-4 text-center text-slate-400 font-bold" x-text="idx + 1"></td>
                                    <td class="py-3 px-4 font-bold text-slate-800" x-text="u.judul"></td>
                                    <td class="py-3 px-4">
                                        <span class="bg-slate-100 text-slate-700 px-2 py-0.5 rounded font-bold uppercase" x-text="u.bab"></span>
                                    </td>
                                    <td class="py-3 px-4 text-slate-600" x-text="formatDateShort(u.tanggal)"></td>
                                    <td class="py-3 px-4 text-slate-600" x-text="`${u.durasi} Menit`"></td>
                                    <td class="py-3 px-4">
                                        <div class="flex flex-wrap gap-1">
                                            <template x-for="k in u.kelasList" :key="k.id">
                                                <span class="inline-block px-2 py-0.5 bg-blue-50 text-blue-700 text-[10px] font-bold rounded border border-blue-100" x-text="k.nama_kelas"></span>
                                            </template>
                                            <template x-if="!u.kelasList || u.kelasList.length === 0">
                                                <span class="text-[10px] text-slate-400 italic">Belum diaktifkan</span>
                                            </template>
                                        </div>
                                    </td>
                                    <td class="py-3 px-4 text-center">
                                        <template x-if="u.status === 'draft'">
                                            <span class="inline-block px-2.5 py-0.5 bg-slate-100 text-slate-700 text-[11px] font-bold rounded-full border border-slate-200">Draft</span>
                                        </template>
                                        <template x-if="u.status === 'aktif'">
                                            <span class="inline-block px-2.5 py-0.5 bg-green-100 text-green-700 text-[11px] font-bold rounded-full border border-green-200 animate-pulse">Aktif</span>
                                        </template>
                                        <template x-if="u.status === 'selesai'">
                                            <span class="inline-block px-2.5 py-0.5 bg-amber-100 text-amber-700 text-[11px] font-bold rounded-full border border-amber-200">Selesai</span>
                                        </template>
                                    </td>
                                    <td class="py-3 px-4 text-center">
                                        <template x-if="u.status === 'aktif' && u.token">
                                            <span class="font-mono bg-slate-900 text-yellow-400 px-2 py-1 rounded text-xs font-bold tracking-wider select-all" x-text="u.token"></span>
                                        </template>
                                        <template x-if="u.status !== 'aktif' || !u.token">
                                            <span class="text-slate-400">-</span>
                                        </template>
                                    </td>
                                    <td class="py-3 px-4 text-center">
                                        <div class="flex items-center justify-center gap-1.5 flex-wrap">
                                            <!-- DRAFT ACTIONS -->
                                            <template x-if="u.status === 'draft'">
                                                <div class="flex items-center gap-1">
                                                    <button @click="openDetail(u.id)" class="text-blue-600 hover:text-blue-800 font-bold text-xs bg-blue-50 hover:bg-blue-100 py-1 px-2.5 rounded-lg border border-blue-200 transition-colors">
                                                        Soal & Detail
                                                    </button>
                                                    <button @click="confirmActivate(u)" class="bg-green-600 hover:bg-green-700 text-white font-bold text-xs py-1 px-2.5 rounded-lg shadow-xs transition-colors">
                                                        Aktifkan
                                                    </button>
                                                    <button @click="confirmDeleteUjian(u)" class="text-red-600 hover:text-red-800 font-bold text-xs bg-red-50 hover:bg-red-100 p-1.5 rounded-lg border border-red-200 transition-colors" title="Hapus Ujian">
                                                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                                    </button>
                                                </div>
                                            </template>

                                            <!-- AKTIF ACTIONS -->
                                            <template x-if="u.status === 'aktif'">
                                                <div class="flex items-center gap-1">
                                                    <button @click="openMonitoring(u.id)" class="bg-sky-600 hover:bg-sky-700 text-white font-bold text-xs py-1 px-2.5 rounded-lg shadow-sm flex items-center gap-1 transition-colors">
                                                        <span class="relative flex h-2 w-2">
                                                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-white opacity-75"></span>
                                                            <span class="relative inline-flex rounded-full h-2 w-2 bg-white"></span>
                                                        </span>
                                                        Monitor
                                                    </button>
                                                    <button @click="confirmFinish(u)" class="bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs py-1 px-2.5 rounded-lg shadow-sm transition-colors">
                                                        Akhiri
                                                    </button>
                                                </div>
                                            </template>

                                            <!-- SELESAI ACTIONS -->
                                            <template x-if="u.status === 'selesai'">
                                                <div class="flex items-center gap-1 flex-wrap justify-center">
                                                    <button @click="openDetail(u.id)" class="text-blue-600 hover:text-blue-800 font-bold text-[11px] bg-blue-50 hover:bg-blue-100 py-1 px-2 rounded-lg border border-blue-200">
                                                        ⚙️ Setting
                                                    </button>
                                                    <button @click="openMonitoring(u.id)" class="text-slate-600 hover:text-slate-800 font-bold text-[11px] bg-slate-100 hover:bg-slate-200 py-1 px-2 rounded-lg border border-slate-200">
                                                        Hasil
                                                    </button>
                                                    <template x-if="u.soal_essay_count > 0">
                                                        <button @click="openKoreksi(u.id)" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-[11px] py-1 px-2 rounded-lg shadow-xs">
                                                            Koreksi
                                                        </button>
                                                    </template>
                                                    <button @click="confirmFinalisasi(u)" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-[11px] py-1 px-2 rounded-lg shadow-xs" title="Finalisasi ke Rekap Nilai">
                                                        Finalisasi
                                                    </button>
                                                </div>
                                            </template>
                                        </div>
                                    </td>
                                </tr>
                            </template>
                            <template x-if="ujians.length === 0">
                                <tr>
                                    <td colspan="9" class="text-center py-10 text-slate-400 text-xs italic">Belum ada paket ujian yang terdaftar.</td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </template>

    <!-- ========================================================================= -->
    <!-- VIEW 2: BUAT UJIAN BARU (CREATE VIEW) -->
    <!-- ========================================================================= -->
    <template x-if="viewMode === 'create'">
        <div class="max-w-xl bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
            <div class="mb-5 pb-4 border-b border-slate-100">
                <h3 class="text-base font-extrabold text-slate-800">Langkah 1: Informasi Ujian</h3>
                <p class="text-xs text-slate-500 mt-1">Isi judul dan materi ujian terlebih dahulu. Waktu, durasi, token, dan kelas target diatur saat ujian akan diaktifkan.</p>
            </div>

            <form @submit.prevent="submitCreateUjian" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Judul Ujian <span class="text-red-500">*</span></label>
                    <input type="text" x-model="formCreate.judul" required placeholder="Contoh: Ulangan Harian 1 - Jaringan Komputer" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Materi / Bab <span class="text-red-500">*</span></label>
                    <input type="text" x-model="formCreate.bab" required list="daftarBabOptions" placeholder="Contoh: Bab 1 - Jaringan Komputer" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
                    <datalist id="daftarBabOptions">
                        <template x-for="b in daftarBab" :key="b">
                            <option :value="b"></option>
                        </template>
                    </datalist>
                    <p class="text-[10px] text-slate-400 mt-1">* Pastikan nama Bab sesuai dengan Bab di Rekap Nilai agar nilai ulangan otomatis tersinkronisasi saat finalisasi.</p>
                </div>

                <div class="bg-blue-50 border border-blue-200 rounded-xl p-3.5 text-xs text-blue-800 flex items-start gap-2.5">
                    <svg class="w-5 h-5 text-blue-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <div>
                        <span class="font-bold">Info:</span> Setelah membuat paket ujian, Anda dapat menambahkan soal-soal PG & Essay. Tanggal, durasi, token, dan aktivasi pilihan kelas akan diatur melalui menu <strong>Setting Ujian</strong>.
                    </div>
                </div>

                <div class="flex justify-end gap-2 border-t border-slate-100 pt-4">
                    <button type="button" @click="viewMode = 'list'" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl text-xs font-bold transition-all">Batal</button>
                    <button type="submit" :disabled="loadingSubmit" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-xl text-xs font-extrabold shadow-md transition-all active:scale-[0.98] disabled:opacity-70">
                        <span x-show="!loadingSubmit">Buat Ujian & Lanjut Tambah Soal ➔</span>
                        <span x-show="loadingSubmit">Memproses...</span>
                    </button>
                </div>
            </form>
        </div>
    </template>

    <!-- ========================================================================= -->
    <!-- VIEW 3: DETAIL & BANK SOAL UJIAN (DETAIL VIEW) -->
    <!-- ========================================================================= -->
    <template x-if="viewMode === 'detail'">
        <div class="space-y-6">
            <!-- Top Action Bar -->
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-wrap items-center justify-between gap-4">
                <div>
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-xs bg-slate-100 text-slate-700 font-extrabold px-2.5 py-0.5 rounded-md border border-slate-200 uppercase" x-text="activeUjian.bab"></span>
                        <template x-if="activeUjian.status === 'draft'">
                            <span class="px-2.5 py-0.5 bg-slate-100 text-slate-700 text-xs font-bold rounded-full border border-slate-200">Status: Draft</span>
                        </template>
                        <template x-if="activeUjian.status === 'aktif'">
                            <span class="px-2.5 py-0.5 bg-green-100 text-green-700 text-xs font-bold rounded-full border border-green-200 animate-pulse">Status: Aktif Ujian</span>
                        </template>
                        <template x-if="activeUjian.status === 'selesai'">
                            <span class="px-2.5 py-0.5 bg-amber-100 text-amber-700 text-xs font-bold rounded-full border border-amber-200">Status: Selesai</span>
                        </template>
                    </div>
                    <h2 class="text-xl font-black text-slate-800" x-text="activeUjian.judul"></h2>
                </div>

                <div class="flex items-center gap-2.5 flex-wrap">
                    <button @click="openSettingModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-extrabold px-4 py-2.5 rounded-xl text-xs shadow-md transition-all active:scale-[0.98] flex items-center gap-1.5 border border-blue-700">
                        <span>⚙️</span> Setting Ujian & Kelas Aktif
                    </button>
                    <template x-if="activeUjian.status === 'draft'">
                        <button @click="confirmActivate(activeUjian)" class="bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold px-4 py-2.5 rounded-xl text-xs shadow-md transition-all active:scale-[0.98]">
                            Aktifkan Ujian
                        </button>
                    </template>
                    <template x-if="activeUjian.status === 'aktif'">
                        <button @click="confirmFinish(activeUjian)" class="bg-amber-600 hover:bg-amber-700 text-white font-extrabold px-4 py-2.5 rounded-xl text-xs shadow-md transition-all active:scale-[0.98]">
                            Akhiri Ujian
                        </button>
                    </template>
                    <button @click="viewMode = 'list'; fetchList()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-3.5 py-2.5 rounded-xl text-xs transition-all">
                        ← Kembali
                    </button>
                </div>
            </div>

            <!-- Grid Layout -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Left: Parameter Card -->
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 h-fit space-y-4">
                    <div class="flex justify-between items-center pb-3 border-b border-slate-100">
                        <h3 class="font-extrabold text-slate-800 text-sm">Parameter Ujian</h3>
                        <button @click="openSettingModal()" class="text-blue-600 hover:text-blue-800 text-xs font-extrabold flex items-center gap-1 bg-blue-50 px-2 py-1 rounded-lg border border-blue-100">
                            Edit Setting
                        </button>
                    </div>

                    <div class="space-y-3.5 text-xs">
                        <div>
                            <label class="text-slate-400 text-[11px] font-semibold block">Tanggal Pelaksanaan</label>
                            <span class="font-bold text-slate-800" x-text="formatDateShort(activeUjian.tanggal) || 'Belum diatur (Atur di Setting)'"></span>
                        </div>

                        <div>
                            <label class="text-slate-400 text-[11px] font-semibold block">Durasi Pengerjaan</label>
                            <span class="font-bold text-slate-800" x-text="`${activeUjian.durasi} Menit`"></span>
                        </div>

                        <div>
                            <label class="text-slate-400 text-[11px] font-semibold block mb-1">Kelas Aktif Peserta</label>
                            <div class="flex flex-wrap gap-1.5">
                                <template x-for="k in activeUjian.kelasList" :key="k.id">
                                    <span class="px-2.5 py-1 bg-blue-50 text-blue-800 text-[11px] font-bold rounded-lg border border-blue-200 flex items-center gap-1">
                                        <span class="w-1.5 h-1.5 rounded-full bg-blue-500"></span>
                                        <span x-text="k.nama_kelas"></span>
                                    </span>
                                </template>
                                <template x-if="!activeUjian.kelasList || activeUjian.kelasList.length === 0">
                                    <span class="text-xs text-amber-700 bg-amber-50 px-2 py-1 rounded border border-amber-200 font-bold block">
                                        ⚠️ Belum ada kelas yang diaktifkan
                                    </span>
                                </template>
                            </div>
                        </div>

                        <div>
                            <label class="text-slate-400 text-[11px] font-semibold block mb-1">Token Ujian Masuk</label>
                            <template x-if="activeUjian.token">
                                <div class="bg-slate-900 text-yellow-400 font-mono font-black text-base px-3 py-1.5 rounded-xl inline-block tracking-widest border border-slate-800 shadow-inner select-all" x-text="activeUjian.token"></div>
                            </template>
                            <template x-if="!activeUjian.token">
                                <span class="text-xs text-slate-400 italic block">Belum ada token (Atur di Setting)</span>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- Right: Bank Soal Ujian -->
                <div class="lg:col-span-2 bg-white rounded-2xl border border-slate-200 shadow-sm p-5 space-y-4">
                    <div class="flex justify-between items-center pb-3 border-b border-slate-100">
                        <div>
                            <h3 class="font-extrabold text-slate-800 text-sm">Bank Soal Ujian</h3>
                            <p class="text-xs text-slate-400 font-medium" x-text="`Total: ${soals.length} Soal (PG: ${soals.filter(s => s.tipe === 'pg').length}, Essay: ${soals.filter(s => s.tipe === 'essay').length})`"></p>
                        </div>
                        <template x-if="activeUjian.status === 'draft'">
                            <button @click="openAddSoalModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-extrabold flex items-center gap-1.5 text-xs py-2 px-3.5 rounded-xl shadow-md transition-all active:scale-[0.98]">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                                Tambah Soal
                            </button>
                        </template>
                    </div>

                    <div class="space-y-4">
                        <template x-for="(soal, sIdx) in soals" :key="soal.id">
                            <div :class="soal.tipe === 'pg' ? 'border-slate-200 bg-slate-50/50' : 'border-dashed border-indigo-200 bg-indigo-50/20'" class="p-4 rounded-xl border">
                                <div class="flex justify-between items-start mb-2 gap-4">
                                    <div class="flex items-center gap-2">
                                        <span class="w-6 h-6 bg-slate-200 text-slate-800 rounded-full text-xs font-black flex items-center justify-center" x-text="sIdx + 1"></span>
                                        <span :class="soal.tipe === 'pg' ? 'bg-blue-100 text-blue-800 border-blue-200' : 'bg-indigo-100 text-indigo-800 border-indigo-200'" class="px-2 py-0.5 rounded text-[10px] font-black uppercase border" x-text="soal.tipe"></span>
                                        <span class="text-xs text-slate-500 font-bold" x-text="`Bobot: ${soal.bobot}`"></span>
                                    </div>
                                    <template x-if="activeUjian.status === 'draft'">

        <div class="space-y-5">
            <div class="flex items-center justify-between bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <div>
                    <h2 class="text-base font-black text-slate-800" x-text="koreksiData.ujian.judul"></h2>
                    <p class="text-xs text-slate-500 mt-0.5">Materi/Bab: <span x-text="koreksiData.ujian.bab"></span> | Masukkan nilai total essay (0-100) untuk masing-masing siswa di bawah ini.</p>

                <button @click="viewMode = 'list'; fetchList()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs py-2 px-3.5 rounded-xl transition-colors">

                        <div class="p-4 rounded-xl border border-slate-200 hover:border-blue-300 transition-colors bg-slate-50/20">

                                <div>
                                    <h4 class="font-bold text-slate-800 text-sm" x-text="p.nama_siswa"></h4>

                                    <input type="number" min="0" max="100" step="0.5" x-model="formKoreksi[p.siswa_id]" required class="w-24 bg-white border border-slate-300 rounded-xl px-2 py-1.5 text-center font-bold text-blue-700 text-sm focus:ring-2 focus:ring-blue-500">
                                </div>
                            </div>

                                <template x-for="(ans, aIdx) in p.essay_answers" :key="ans.soal_id">
                                    <div class="text-xs border-l-2 border-indigo-200 pl-3">
                                        <div class="font-semibold text-slate-500 mb-1" x-text="`Pertanyaan ${aIdx + 1} (Bobot: ${ans.bobot}):`"></div>
                                        <div class="text-slate-800 font-semibold mb-1.5 whitespace-pre-line" x-text="ans.pertanyaan"></div>
                                        <div class="font-semibold text-slate-500 mb-0.5">Jawaban Siswa:</div>
                                        <template x-if="ans.jawaban_siswa && ans.jawaban_siswa.trim() !== ''">
                                            <div class="text-slate-800 bg-white p-2.5 rounded-xl border border-slate-200 font-mono whitespace-pre-wrap" x-text="ans.jawaban_siswa"></div>
                                        </template>
                                        <template x-if="!ans.jawaban_siswa || ans.jawaban_siswa.trim() === ''">
                                            <div class="text-red-500 italic p-1">Siswa tidak menjawab pertanyaan ini.</div>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                    <template x-if="koreksiData.peserta.length === 0">
                        <div class="text-center py-10 text-slate-400 text-xs italic">Belum ada peserta yang selesai mengerjakan ujian ini.</div>

                </h3>
                <button @click="settingModal = false" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>

                        <label class="block text-xs font-bold text-slate-700 mb-1">Durasi Pengerjaan (Menit)</label>

                                <span class="text-xs font-bold text-slate-700" x-text="k.nama_kelas"></span>

                            <input type="radio" name="tokenOption" value="keep" x-model="formSetting.token_option" class="text-blue-600 focus:ring-blue-500">
                            <span>Pertahankan Token Sekarang (<strong class="font-mono text-blue-700" x-text="activeUjian.token || 'Belum ada'"></strong>)</span>

                        <span x-show="loadingSubmit">Menyimpan...</span>
                    </button>
                </div>

        </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Teks Pertanyaan <span class="text-red-500">*</span></label>
                    <textarea x-model="formSoal.pertanyaan" required rows="4" placeholder="Tulis pertanyaan soal di sini..." class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-xs leading-relaxed focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <!-- Opsi Jawaban PG -->
                <template x-if="formSoal.tipe === 'pg'">
                    <div class="space-y-3 pt-2 border-t border-slate-100">
                        <label class="block text-xs font-bold text-slate-700">Pilihan Jawaban & Kunci Benar:</label>
                        
                        <div class="flex items-center gap-2">
                            <input type="radio" name="kunciPg" value="a" x-model="formSoal.jawaban_benar" class="w-4 h-4 text-green-600 focus:ring-green-500 cursor-pointer">
                            <input type="text" x-model="formSoal.opsi_a" required placeholder="Opsi A" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-1.5 text-xs font-medium">
                        </div>

                        <div class="flex items-center gap-2">
                            <input type="radio" name="kunciPg" value="b" x-model="formSoal.jawaban_benar" class="w-4 h-4 text-green-600 focus:ring-green-500 cursor-pointer">
                            <input type="text" x-model="formSoal.opsi_b" required placeholder="Opsi B" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-1.5 text-xs font-medium">
                        </div>

                        <div class="flex items-center gap-2">
                            <input type="radio" name="kunciPg" value="c" x-model="formSoal.jawaban_benar" class="w-4 h-4 text-green-600 focus:ring-green-500 cursor-pointer">
                            <input type="text" x-model="formSoal.opsi_c" required placeholder="Opsi C" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-1.5 text-xs font-medium">
                        </div>

                        <div class="flex items-center gap-2">
                            <input type="radio" name="kunciPg" value="d" x-model="formSoal.jawaban_benar" class="w-4 h-4 text-green-600 focus:ring-green-500 cursor-pointer">
                            <input type="text" x-model="formSoal.opsi_d" required placeholder="Opsi D" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-1.5 text-xs font-medium">
                        </div>

                        <p class="text-[10px] text-slate-400">* Pilih radio button pada opsi yang merupakan kunci jawaban yang benar.</p>
                    </div>
                </template>

                <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
                    <button type="button" @click="soalModalOpen = false" class="px-4 py-2 text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl">Batal</button>
                    <button type="submit" :disabled="loadingSubmit" class="px-5 py-2 text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-xl shadow-md disabled:opacity-70">
                        <span x-show="!loadingSubmit" x-text="formSoal.id ? 'Simpan Perubahan' : 'Tambah Soal'"></span>
                        <span x-show="loadingSubmit">Menyimpan...</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

</div>

<!-- ALPINE JS LOGIC -->
<script>
function ujianGuruData() {
    return {
        viewMode: 'list', // 'list', 'create', 'detail', 'monitoring', 'koreksi'
        loadingList: true,
        loadingSubmit: false,
        statusFilter: '',
        ujians: [],
        daftarBab: [],
        allKelas: [],

        // Detail View State
        activeUjian: {},
        soals: [],

        // Monitoring State
        monitoringTab: 'peserta', // 'peserta', 'logs'
        monitoringData: {
            ujian: {},
            total_soal: 0,
            peserta: [],
            logs: []
        },

        // Koreksi State
        koreksiData: {
            ujian: {},
            soal_essay: [],
            kkm: 75,
            peserta: []
        },
        formKoreksi: {},

        // Modals State
        settingModal: false,
        formSetting: {
            tanggal: '',
            durasi: 60,
            kelas_ids: [],
            token_option: 'keep',
            custom_token: ''
        },

        soalModalOpen: false,
        formSoal: {
            id: null,
            tipe: 'pg',
            pertanyaan: '',
            bobot: 5,
            opsi_a: '',
            opsi_b: '',
            opsi_c: '',
            opsi_d: '',
            jawaban_benar: 'a'
        },

        formCreate: {
            judul: '',
            bab: ''
        },

        notification: {
            show: false,
            type: 'success',
            message: ''
        },

        showNotif(type, message) {
            this.notification.show = true;
            this.notification.type = type;
            this.notification.message = message;
            setTimeout(() => { this.notification.show = false; }, 5000);
        },

        initData() {
            this.fetchList();
        },

        fetchList() {
            this.loadingList = true;
            var token = localStorage.getItem('spensa_token');
            if (!token) {
                this.loadingList = false;
                this.showNotif('error', 'Sesi login tidak ditemukan. Silakan login kembali.');
                return;
            }

            google.script.run
                .withSuccessHandler((response) => {
                    this.loadingList = false;
                    if (response && response.status === 'success') {
                        this.ujians = response.data.ujians || [];
                        this.daftarBab = response.data.daftar_bab || [];
                        this.allKelas = response.data.all_kelas || [];
                    } else {
                        var errMsg = (response && response.message) ? response.message : 'Gagal memuat ujian';
                        this.showNotif('error', errMsg);
                    }
                })
                .withFailureHandler((error) => {
                    this.loadingList = false;
                    this.showNotif('error', error.message || 'Terjadi kesalahan saat memuat data ujian');
                })
                .getUjianInit(token, this.statusFilter || '');
        },

        openCreateForm() {
            this.formCreate = { judul: '', bab: '' };
            this.viewMode = 'create';
        },

        submitCreateUjian() {
            if (!this.formCreate.judul.trim() || !this.formCreate.bab.trim()) {
                this.showNotif('error', 'Judul dan Bab materi wajib diisi.');
                return;
            }

            this.loadingSubmit = true;
            var token = localStorage.getItem('spensa_token');

            google.script.run
                .withSuccessHandler((response) => {
                    this.loadingSubmit = false;
                    if (response && response.status === 'success') {
                        this.showNotif('success', response.message);
                        this.openDetail(response.data.ujian_id);
                    } else {
                        this.showNotif('error', response ? response.message : 'Gagal membuat ujian');
                    }
                })
                .withFailureHandler((error) => {
                    this.loadingSubmit = false;
                    this.showNotif('error', error.message || 'Gagal menghubungi server');
                })
                .storeUjian(token, this.formCreate);
        },

        openDetail(ujianId) {
            var token = localStorage.getItem('spensa_token');
            this.loadingList = true;

            google.script.run
                .withSuccessHandler((response) => {
                    this.loadingList = false;
                    if (response && response.status === 'success') {
                        this.activeUjian = response.data.ujian || {};
                        this.soals = response.data.soals || [];
                        this.allKelas = response.data.all_kelas || [];
                        this.viewMode = 'detail';
                    } else {
                        this.showNotif('error', response ? response.message : 'Gagal memuat detail ujian');
                    }
                })
                .withFailureHandler((error) => {
                    this.loadingList = false;
                    this.showNotif('error', error.message || 'Gagal memuat data ujian');
                })
                .getUjianDetail(token, ujianId);
        },

        openSettingModal() {
            var kIds = [];
            if (this.activeUjian.kelasList) {
                kIds = this.activeUjian.kelasList.map(k => k.id);
            } else if (this.activeUjian.kelas_ids) {
                kIds = this.activeUjian.kelas_ids;
            }

            this.formSetting = {
                tanggal: this.activeUjian.tanggal ? this.activeUjian.tanggal.split('T')[0] : '',
                durasi: this.activeUjian.durasi || 60,
                kelas_ids: kIds,
                token_option: 'keep',
                custom_token: ''
            };
            this.settingModal = true;
        },

        submitSettingUjian() {
            this.loadingSubmit = true;
            var token = localStorage.getItem('spensa_token');

            google.script.run
                .withSuccessHandler((response) => {
                    this.loadingSubmit = false;
                    if (response && response.status === 'success') {
                        this.showNotif('success', response.message);
                        this.settingModal = false;
                        this.openDetail(this.activeUjian.id);
                    } else {
                        this.showNotif('error', response ? response.message : 'Gagal menyimpan setting');
                    }
                })
                .withFailureHandler((error) => {
                    this.loadingSubmit = false;
                    this.showNotif('error', error.message || 'Gagal menyimpan setting');
                })
                .saveSettingUjian(token, this.activeUjian.id, this.formSetting);
        },

        openAddSoalModal() {
            this.formSoal = {
                id: null,
                tipe: 'pg',
                pertanyaan: '',
                bobot: 5,
                opsi_a: '',
                opsi_b: '',
                opsi_c: '',
                opsi_d: '',
                jawaban_benar: 'a'
            };
            this.soalModalOpen = true;
        },

        openEditSoalModal(soal) {
            this.formSoal = {
                id: soal.id,
                tipe: soal.tipe,
                pertanyaan: soal.pertanyaan,
                bobot: soal.bobot,
                opsi_a: soal.opsi_a || '',
                opsi_b: soal.opsi_b || '',
                opsi_c: soal.opsi_c || '',
                opsi_d: soal.opsi_d || '',
                jawaban_benar: soal.jawaban_benar || 'a'
            };
            this.soalModalOpen = true;
        },

        submitSoal() {
            if (!this.formSoal.pertanyaan.trim()) {
                this.showNotif('error', 'Teks pertanyaan wajib diisi.');
                return;
            }

            this.loadingSubmit = true;
            var token = localStorage.getItem('spensa_token');

            if (this.formSoal.id) {
                // Update
                google.script.run
                    .withSuccessHandler((response) => {
                        this.loadingSubmit = false;
                        if (response && response.status === 'success') {
                            this.showNotif('success', response.message);
                            this.soalModalOpen = false;
                            this.openDetail(this.activeUjian.id);
                        } else {
                            this.showNotif('error', response ? response.message : 'Gagal memperbarui soal');
                        }
                    })
                    .withFailureHandler((error) => {
                        this.loadingSubmit = false;
                        this.showNotif('error', error.message);
                    })
                    .updateSoal(token, this.activeUjian.id, this.formSoal.id, this.formSoal);
            } else {
                // Insert
                google.script.run
                    .withSuccessHandler((response) => {
                        this.loadingSubmit = false;
                        if (response && response.status === 'success') {
                            this.showNotif('success', response.message);
                            this.soalModalOpen = false;
                            this.openDetail(this.activeUjian.id);
                        } else {
                            this.showNotif('error', response ? response.message : 'Gagal menambah soal');
                        }
                    })
                    .withFailureHandler((error) => {
                        this.loadingSubmit = false;
                        this.showNotif('error', error.message);
                    })
                    .storeSoal(token, this.activeUjian.id, this.formSoal);
            }
        },

        confirmDeleteSoal(soal) {
            if (!confirm('Yakin ingin menghapus butir soal ini?')) return;
            var token = localStorage.getItem('spensa_token');

            google.script.run
                .withSuccessHandler((response) => {
                    if (response && response.status === 'success') {
                        this.showNotif('success', response.message);
                        this.openDetail(this.activeUjian.id);
                    } else {
                        this.showNotif('error', response ? response.message : 'Gagal menghapus soal');
                    }
                })
                .withFailureHandler((error) => {
                    this.showNotif('error', error.message);
                })
                .destroySoal(token, this.activeUjian.id, soal.id);
        },

        confirmActivate(u) {
            if (!confirm('Aktifkan ujian "' + u.judul + '"? Token akan dibuat dan peserta dari kelas target bisa mulai mengerjakan.')) return;
            var token = localStorage.getItem('spensa_token');

            google.script.run
                .withSuccessHandler((response) => {
                    if (response && response.status === 'success') {
                        this.showNotif('success', response.message);
                        this.fetchList();
                        if (this.viewMode === 'detail') this.openDetail(u.id);
                    } else {
                        this.showNotif('error', response ? response.message : 'Gagal mengaktifkan ujian');
                    }
                })
                .withFailureHandler((error) => {
                    this.showNotif('error', error.message);
                })
                .activateUjian(token, u.id);
        },

        confirmFinish(u) {
            if (!confirm('Akhiri ujian "' + u.judul + '"? Siswa yang sedang mengerjakan akan otomatis dikumpulkan dan dinilai.')) return;
            var token = localStorage.getItem('spensa_token');

            google.script.run
                .withSuccessHandler((response) => {
                    if (response && response.status === 'success') {
                        this.showNotif('success', response.message);
                        this.fetchList();
                        if (this.viewMode === 'detail') this.openDetail(u.id);
                    } else {
                        this.showNotif('error', response ? response.message : 'Gagal mengakhiri ujian');
                    }
                })
                .withFailureHandler((error) => {
                    this.showNotif('error', error.message);
                })
                .finishUjian(token, u.id);
        },

        confirmDeleteUjian(u) {
            if (!confirm('Hapus paket ujian "' + u.judul + '" beserta seluruh bank soalnya?')) return;
            var token = localStorage.getItem('spensa_token');

            google.script.run
                .withSuccessHandler((response) => {
                    if (response && response.status === 'success') {
                        this.showNotif('success', response.message);
                        this.fetchList();
                    } else {
                        this.showNotif('error', response ? response.message : 'Gagal menghapus ujian');
                    }
                })
                .withFailureHandler((error) => {
                    this.showNotif('error', error.message);
                })
                .destroyUjian(token, u.id);
        },

        openMonitoring(ujianId) {
            var token = localStorage.getItem('spensa_token');
            this.loadingList = true;

            google.script.run
                .withSuccessHandler((response) => {
                    this.loadingList = false;
                    if (response && response.status === 'success') {
                        this.monitoringData = response.data;
                        this.viewMode = 'monitoring';
                    } else {
                        this.showNotif('error', response ? response.message : 'Gagal memuat monitoring');
                    }
                })
                .withFailureHandler((error) => {
                    this.loadingList = false;
                    this.showNotif('error', error.message);
                })
                .getMonitoringData(token, ujianId);
        },

        refreshMonitoring() {
            if (this.monitoringData && this.monitoringData.ujian && this.monitoringData.ujian.id) {
                this.openMonitoring(this.monitoringData.ujian.id);
            }
        },

        openKoreksi(ujianId) {
            var token = localStorage.getItem('spensa_token');
            this.loadingList = true;

            google.script.run
                .withSuccessHandler((response) => {
                    this.loadingList = false;
                    if (response && response.status === 'success') {
                        this.koreksiData = response.data;
                        this.formKoreksi = {};
                        (this.koreksiData.peserta || []).forEach(p => {
                            this.formKoreksi[p.siswa_id] = p.nilai_essay || 0;
                        });
                        this.viewMode = 'koreksi';
                    } else {
                        this.showNotif('error', response ? response.message : 'Gagal memuat koreksi essay');
                    }
                })
                .withFailureHandler((error) => {
                    this.loadingList = false;
                    this.showNotif('error', error.message);
                })
                .getKoreksiData(token, ujianId);
        },

        submitKoreksiEssay() {
            this.loadingSubmit = true;
            var token = localStorage.getItem('spensa_token');

            google.script.run
                .withSuccessHandler((response) => {
                    this.loadingSubmit = false;
                    if (response && response.status === 'success') {
                        this.showNotif('success', response.message);
                        this.openKoreksi(this.koreksiData.ujian.id);
                    } else {
                        this.showNotif('error', response ? response.message : 'Gagal menyimpan nilai essay');
                    }
                })
                .withFailureHandler((error) => {
                    this.loadingSubmit = false;
                    this.showNotif('error', error.message);
                })
                .storeKoreksiEssay(token, this.koreksiData.ujian.id, { nilai_essay: this.formKoreksi });
        },

        confirmFinalisasi(u) {
            if (!confirm('Finalisasi nilai ujian "' + u.judul + '"? Seluruh nilai akhir ulangan akan otomatis disinkronkan ke Rekap Nilai Siswa.')) return;
            var token = localStorage.getItem('spensa_token');

            google.script.run
                .withSuccessHandler((response) => {
                    if (response && response.status === 'success') {
                        this.showNotif('success', response.message);
                        this.fetchList();
                    } else {
                        this.showNotif('error', response ? response.message : 'Gagal finalisasi nilai');
                    }
                })
                .withFailureHandler((error) => {
                    this.showNotif('error', error.message);
                })
                .finalisasiUjian(token, u.id);
        },

        // Helper formatters
        formatDateShort(dateStr) {
            if (!dateStr) return '-';
            try {
                var d = new Date(dateStr);
                if (isNaN(d)) return dateStr;
                return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
            } catch(e) { return dateStr; }
        },

        formatDateTime(dateStr) {
            if (!dateStr) return '-';
            try {
                var d = new Date(dateStr);
                if (isNaN(d)) return dateStr;
                return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
            } catch(e) { return dateStr; }
        },

        formatTime(dateStr) {
            if (!dateStr) return '-';
            try {
                var d = new Date(dateStr);
                if (isNaN(d)) return dateStr;
                return d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            } catch(e) { return dateStr; }
        }
    };
}
</script>
