<!-- 
    DataSiswa.html 
    Migrasi 100% Akurat dari resources/views/guru/data-siswa.blade.php
-->
<div x-data="siswaController()" x-init="initData()" class="p-4 sm:p-6 pb-24">

    <!-- Notifikasi -->
    <template x-if="notif.show">
        <div :class="notif.type === 'success' ? 'bg-green-100 text-green-800 border-green-200' : 'bg-red-100 text-red-800 border-red-200'" class="mb-4 p-3 rounded text-sm border shadow-sm flex items-start gap-2">
            <svg x-show="notif.type === 'success'" class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <svg x-show="notif.type === 'error'" class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span x-html="notif.message" class="mt-0.5"></span>
        </div>
    </template>

    <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">
        
        <!-- Edit Modal -->
        <div x-show="editModalOpen" style="display: none;" class="fixed inset-0 z-50 overflow-y-auto bg-black bg-opacity-50 flex items-center justify-center">
            <div class="bg-white rounded p-6 shadow-xl w-full max-w-md mx-4" @click.away="editModalOpen = false">
                <h3 class="font-bold text-slate-800 text-lg mb-4">Ubah Data Siswa</h3>
                <form @submit.prevent="submitEditSiswa">
                    <div class="mb-3">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Nomer Induk</label>
                        <input type="text" x-model="editData.nis" required class="input-compact w-full bg-slate-50 border border-slate-300 rounded px-3 py-2 text-sm" :disabled="isSubmitting">
                    </div>
                    
                    <div class="mb-3">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Lengkap</label>
                        <input type="text" x-model="editData.name" required class="input-compact w-full bg-slate-50 border border-slate-300 rounded px-3 py-2 text-sm" :disabled="isSubmitting">
                    </div>
                    
                    <div class="mb-4">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Kelas</label>
                        <select x-model="editData.kelas_id" required class="input-compact w-full bg-slate-50 border border-slate-300 rounded px-3 py-2 text-sm cursor-pointer" :disabled="isSubmitting">
                            <option value="">-- Pilih --</option>
                            <template x-for="k in kelasList" :key="k.id">
                                <option :value="k.id" x-text="k.nama_kelas"></option>
                            </template>
                        </select>
                    </div>
                    
                    <div class="flex justify-end gap-2">
                        <button type="button" @click="editModalOpen = false" class="btn-compact bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded text-sm font-medium" :disabled="isSubmitting">Batal</button>
                        <button type="submit" class="btn-compact bg-blue-600 hover:bg-blue-700 text-white shadow-sm px-4 py-2 rounded text-sm font-medium flex items-center gap-2" :disabled="isSubmitting">
                            <span x-show="!isSubmitting">Simpan Perubahan</span>
                            <span x-show="isSubmitting">Menyimpan...</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Form Tambah Siswa -->
        <div class="lg:col-span-1">
            <div class="bg-white rounded border border-slate-200 shadow-sm p-4 sticky top-4">
                <h3 class="font-bold text-slate-700 mb-4 pb-2 border-b border-slate-100 text-sm">Tambah Siswa Baru</h3>
                
                <form @submit.prevent="submitAddSiswa" class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Nomer Induk</label>
                        <input type="text" x-model="formData.nis" required placeholder="Contoh: 004123" class="input-compact w-full bg-slate-50 border border-slate-300 rounded px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500" :disabled="isSubmitting">
                    </div>
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Lengkap</label>
                        <input type="text" x-model="formData.name" required placeholder="Nama lengkap siswa" class="input-compact w-full bg-slate-50 border border-slate-300 rounded px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500" :disabled="isSubmitting">
                    </div>
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Kelas</label>
                        <select x-model="formData.kelas_id" required class="input-compact w-full bg-slate-50 border border-slate-300 rounded px-3 py-2 text-sm cursor-pointer focus:ring-blue-500 focus:border-blue-500" :disabled="isSubmitting">
                            <option value="">-- Pilih --</option>
                            <template x-for="k in kelasList" :key="k.id">
                                <option :value="k.id" x-text="k.nama_kelas"></option>
                            </template>
                        </select>
                    </div>
                    
                    <div class="pt-2">
                        <button type="submit" class="btn-compact w-full bg-blue-600 hover:bg-blue-700 text-white border border-blue-700 shadow-sm py-2 rounded text-sm font-medium flex items-center justify-center gap-2" :disabled="isSubmitting">
                            <span x-show="!isSubmitting">Simpan</span>
                            <span x-show="isSubmitting">Memproses...</span>
                        </button>
                    </div>
                    <p class="text-[10px] text-slate-400 mt-2 leading-tight">Sandi default: Nomer Induk</p>
                </form>
            </div>
        </div>

        <!-- Tabel Daftar Siswa -->
        <div class="lg:col-span-3 space-y-4">
            
            <!-- Data Tabel -->
            <div class="bg-white rounded border border-slate-200 shadow-sm p-4">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-3 gap-3 border-b border-slate-100 pb-3">
                    <h3 class="font-bold text-slate-700 text-sm">Daftar Siswa (<span x-text="filteredSiswas.length"></span>)</h3>
                    <div class="flex flex-col sm:flex-row gap-2 w-full sm:w-auto">
                        <input type="text" x-model="filters.search" @input="currentPage = 1" placeholder="Cari NIS/nama..." class="input-compact w-full sm:w-48 bg-slate-50 border border-slate-300 rounded px-3 py-1.5 text-sm">
                        <select x-model="filters.kelas_id" @change="currentPage = 1" class="input-compact w-full sm:w-32 bg-slate-50 border border-slate-300 rounded px-3 py-1.5 text-sm cursor-pointer">
                            <option value="">Semua Kelas</option>
                            <template x-for="k in kelasList" :key="k.id">
                                <option :value="k.id" x-text="k.nama_kelas"></option>
                            </template>
                        </select>
                        <button @click="resetFilters" x-show="filters.search || filters.kelas_id" class="btn-compact bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded flex items-center justify-center text-sm" title="Reset Filter">✕</button>
                    </div>
                </div>

                <!-- Import / Export CSV (Toolbar Ringkas) -->
                <div class="mb-4 flex flex-col md:flex-row gap-2 items-center justify-between bg-slate-50 p-2 rounded border border-slate-200 text-xs">
                    <span class="font-bold text-slate-600">CSV Tools:</span>
                    <div class="flex flex-wrap gap-2 items-center justify-end w-full md:w-auto">
                        <div class="flex items-center space-x-1.5">
                            <select x-model="csv.importKelasId" class="input-compact text-[11px] h-7 w-20 py-0 px-1.5 border border-slate-300 rounded" :disabled="csv.isProcessing">
                                <option value="">Kelas</option>
                                <template x-for="k in kelasList" :key="k.id">
                                    <option :value="k.id" x-text="k.nama_kelas"></option>
                                </template>
                            </select>
                            <input type="file" accept=".csv" x-ref="csvFileInput" class="text-[10px] w-40 text-slate-500 file:py-0.5 file:px-1.5 file:rounded file:border-0 file:text-[10px] file:bg-blue-50 file:text-blue-700 cursor-pointer" :disabled="csv.isProcessing">
                            <button @click="handleImportCSV" class="btn-compact text-[11px] h-7 bg-slate-200 hover:bg-slate-300 text-slate-700 px-2.5 rounded" :disabled="csv.isProcessing">
                                <span x-show="!csv.isProcessing">Import</span>
                                <span x-show="csv.isProcessing">...</span>
                            </button>
                        </div>
                        <span class="text-slate-300 hidden md:inline">|</span>
                        <div class="flex items-center space-x-1.5">
                            <select x-model="csv.exportKelasId" class="input-compact text-[11px] h-7 w-20 py-0 px-1.5 border border-slate-300 rounded" :disabled="csv.isProcessing">
                                <option value="">Kelas</option>
                                <template x-for="k in kelasList" :key="k.id">
                                    <option :value="k.id" x-text="k.nama_kelas"></option>
                                </template>
                            </select>
                            <button @click="handleExportCSV" class="btn-compact text-[11px] h-7 bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 rounded shadow-sm" :disabled="csv.isProcessing">
                                <span x-show="!csv.isProcessing">Export</span>
                                <span x-show="csv.isProcessing">...</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Loading State -->
                <div x-show="isFetching" class="py-8 text-center">
                    <svg class="animate-spin h-8 w-8 text-blue-500 mx-auto mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    <p class="text-sm text-slate-500">Memuat data siswa...</p>
                </div>

                <!-- Empty State -->
                <div x-show="!isFetching && filteredSiswas.length === 0" class="border border-dashed border-slate-300 p-8 rounded text-center text-slate-500 text-sm">
                    <span x-text="siswasList.length === 0 ? 'Belum ada siswa terdaftar.' : 'Siswa tidak ditemukan untuk filter ini.'"></span>
                </div>

                <!-- Data Table -->
                <div x-show="!isFetching && filteredSiswas.length > 0" class="overflow-x-auto">
                    <table class="w-full text-left border-collapse table-compact text-sm">
                        <thead>
                            <tr class="border-b border-slate-200 bg-slate-50">
                                <th class="w-10 text-center py-2 px-3 font-semibold text-slate-600">No</th>
                                <th class="py-2 px-3 font-semibold text-slate-600">Nomer Induk</th>
                                <th class="py-2 px-3 font-semibold text-slate-600">Nama Lengkap</th>
                                <th class="py-2 px-3 font-semibold text-slate-600">Kelas</th>
                                <th class="w-24 text-center py-2 px-3 font-semibold text-slate-600">Aksi</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            <template x-for="(siswa, index) in paginatedSiswas" :key="siswa.id">
                                <tr class="hover:bg-slate-50 transition-colors group">
                                    <td class="text-center text-slate-500 py-2 px-3" x-text="((currentPage - 1) * perPage) + index + 1"></td>
                                    <td class="font-mono text-slate-600 py-2 px-3" x-text="siswa.nis"></td>
                                    <td class="font-medium text-slate-800 py-2 px-3" x-text="siswa.user.name || '-'"></td>
                                    <td class="text-slate-600 py-2 px-3" x-text="siswa.kelas.nama_kelas || '-'"></td>
                                    <td class="text-center py-2 px-3">
                                        <div class="flex items-center justify-center space-x-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                            <button @click="resetPassword(siswa.id, siswa.nis)" class="text-orange-500 hover:text-orange-700 hover:bg-orange-50 p-1.5 rounded" title="Reset Sandi ke NIS">
                                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                                            </button>
                                            <button @click="openEditModal(siswa)" class="text-blue-500 hover:text-blue-700 hover:bg-blue-50 p-1.5 rounded" title="Ubah">
                                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                                            </button>
                                            <button @click="deleteSiswa(siswa.id, siswa.user.name)" class="text-red-500 hover:text-red-700 hover:bg-red-50 p-1.5 rounded" title="Hapus">
                                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div x-show="!isFetching && totalPages > 1" class="mt-4 flex items-center justify-between border-t border-slate-100 pt-4">
                    <span class="text-xs text-slate-500" x-text="`Menampilkan ${((currentPage-1)*perPage)+1} sampai ${Math.min(currentPage*perPage, filteredSiswas.length)} dari ${filteredSiswas.length} entri`"></span>
                    <div class="flex items-center gap-1">
                        <button @click="if (currentPage > 1) currentPage--" :disabled="currentPage === 1" class="px-2 py-1 text-xs border border-slate-200 rounded text-slate-600 hover:bg-slate-50 disabled:opacity-50">Prev</button>
                        <template x-for="page in totalPages" :key="page">
                            <!-- Hanya tampilkan max 5 tombol halaman -->
                            <button x-show="page === 1 || page === totalPages || Math.abs(page - currentPage) <= 1"
                                    @click="currentPage = page" 
                                    :class="currentPage === page ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'" 
                                    class="px-2.5 py-1 text-xs border rounded transition-colors" x-text="page"></button>
                        </template>
                        <button @click="if (currentPage < totalPages) currentPage++" :disabled="currentPage === totalPages" class="px-2 py-1 text-xs border border-slate-200 rounded text-slate-600 hover:bg-slate-50 disabled:opacity-50">Next</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function siswaController() {
    return {
        isFetching: true,
        isSubmitting: false,
        
        kelasList: [],
        siswasList: [],
        
        formData: {
            nis: '',
            name: '',
            kelas_id: ''
        },
        
        editModalOpen: false,
        editData: {
            id: '',
            nis: '',
            name: '',
            kelas_id: ''
        },
        
        filters: {
            search: '',
            kelas_id: ''
        },
        
        csv: {
            importKelasId: '',
            exportKelasId: '',
            isProcessing: false
        },
        
        // Pagination
        currentPage: 1,
        perPage: 15,
        
        notif: {
            show: false,
            type: '',
            message: ''
        },
        
        showNotif(type, message) {
            this.notif = { show: true, type, message };
            setTimeout(() => { this.notif.show = false; }, 5000);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        },

        initData() {
            this.fetchKelas();
            this.fetchSiswa();
            
            // Watchers for filtering to reset pagination
            this.$watch('filters.search', () => { this.currentPage = 1; });
            this.$watch('filters.kelas_id', () => { this.currentPage = 1; });
        },
        
        fetchKelas() {
            google.script.run
                .withSuccessHandler((response) => {
                    if (response.status === 'success') {
                        this.kelasList = response.data;
                    }
                })
                .getDataKelas(localStorage.getItem('spensa_token'));
        },

        fetchSiswa() {
            this.isFetching = true;
            google.script.run
                .withSuccessHandler((response) => {
                    this.isFetching = false;
                    if (response.status === 'success') {
                        // Urutkan berdasarkan id secara default (terbaru di akhir/awal)
                        this.siswasList = response.data.sort((a, b) => b.id - a.id);
                    } else if (response.status === 'unauthorized') {
                        window.top.location.href = "<?= scriptUrl ?>?page=login";
                    } else {
                        this.showNotif('error', response.message);
                    }
                })
                .withFailureHandler((error) => {
                    this.isFetching = false;
                    this.showNotif('error', 'Gagal memuat data siswa: ' + error.message);
                })
                .getDataSiswa(localStorage.getItem('spensa_token'));
        },
        
        get filteredSiswas() {
            return this.siswasList.filter(s => {
                const matchClass = !this.filters.kelas_id || s.kelas_id == this.filters.kelas_id;
                const searchStr = this.filters.search.toLowerCase();
                const matchSearch = !searchStr || 
                    String(s.nis).toLowerCase().includes(searchStr) || 
                    (s.user && s.user.name && s.user.name.toLowerCase().includes(searchStr));
                
                return matchClass && matchSearch;
            }).sort((a, b) => {
                let nameA = (a.user && a.user.name ? a.user.name : a.nama || '').toLowerCase();
                let nameB = (b.user && b.user.name ? b.user.name : b.nama || '').toLowerCase();
                return nameA.localeCompare(nameB);
            });
        },
        
        get totalPages() {
            return Math.ceil(this.filteredSiswas.length / this.perPage) || 1;
        },
        
        get paginatedSiswas() {
            const start = (this.currentPage - 1) * this.perPage;
            const end = start + this.perPage;
            return this.filteredSiswas.slice(start, end);
        },
        
        resetFilters() {
            this.filters.search = '';
            this.filters.kelas_id = '';
            this.currentPage = 1;
        },

        submitAddSiswa() {
            if (!this.formData.nis || !this.formData.name || !this.formData.kelas_id) return;
            
            this.isSubmitting = true;
            
            // Password and username default is NIS
            const payload = {
                ...this.formData,
                username: this.formData.nis,
                password: this.formData.nis
            };
            
            google.script.run
                .withSuccessHandler((response) => {
                    this.isSubmitting = false;
                    if (response.status === 'success') {
                        this.showNotif('success', 'Berhasil menambahkan siswa baru.');
                        this.formData = { nis: '', name: '', kelas_id: '' };
                        this.fetchSiswa(); // Refresh list
                    } else if (response.status === 'validation_error') {
                        let errStr = Object.values(response.errors).flat().join('<br>');
                        this.showNotif('error', '<strong>Gagal:</strong><br>' + errStr);
                    } else {
                        this.showNotif('error', response.message);
                    }
                })
                .withFailureHandler((error) => {
                    this.isSubmitting = false;
                    this.showNotif('error', 'Gagal koneksi: ' + error.message);
                })
                .storeSiswa(localStorage.getItem('spensa_token'), payload);
        },
        
        openEditModal(siswa) {
            this.editData = {
                id: siswa.id,
                nis: siswa.nis,
                name: siswa.user ? siswa.user.name : '',
                kelas_id: siswa.kelas_id
            };
            this.editModalOpen = true;
        },
        
        submitEditSiswa() {
            this.isSubmitting = true;
            google.script.run
                .withSuccessHandler((response) => {
                    this.isSubmitting = false;
                    if (response.status === 'success') {
                        this.editModalOpen = false;
                        this.showNotif('success', response.message);
                        this.fetchSiswa();
                    } else if (response.status === 'validation_error') {
                        let errStr = Object.values(response.errors).flat().join('<br>');
                        this.showNotif('error', '<strong>Gagal:</strong><br>' + errStr);
                    } else {
                        this.showNotif('error', response.message);
                    }
                })
                .withFailureHandler((error) => {
                    this.isSubmitting = false;
                    this.showNotif('error', 'Gagal koneksi: ' + error.message);
                })
                .updateSiswa(localStorage.getItem('spensa_token'), this.editData.id, this.editData);
        },

        deleteSiswa(id, name) {
            if (!confirm(`Hapus data siswa "${name}" secara permanen?\nIni juga akan menghapus data nilai dan absennya.`)) {
                return;
            }
            
            google.script.run
                .withSuccessHandler((response) => {
                    if (response.status === 'success') {
                        this.showNotif('success', 'Data siswa berhasil dihapus.');
                        this.fetchSiswa();
                    } else {
                        this.showNotif('error', response.message);
                    }
                })
                .withFailureHandler((error) => {
                    this.showNotif('error', 'Gagal koneksi: ' + error.message);
                })
                .deleteSiswa(localStorage.getItem('spensa_token'), id);
        },
        
        resetPassword(id, nis) {
            if (!confirm(`Reset kata sandi dan username siswa ini ke NIS (${nis})?`)) {
                return;
            }
            
            google.script.run
                .withSuccessHandler((response) => {
                    if (response.status === 'success') {
                        this.showNotif('success', 'Kata sandi berhasil direset ke NIS.');
                    } else {
                        this.showNotif('error', response.message);
                    }
                })
                .withFailureHandler((error) => {
                    this.showNotif('error', 'Gagal koneksi: ' + error.message);
                })
                .resetPasswordSiswa(localStorage.getItem('spensa_token'), id);
        },
        
        dummyAction(action) {
            alert(`Fitur ${action} tidak tersedia dalam mode SPA saat ini karena limitasi Google Apps Script file system.`);
        },
        
        handleExportCSV() {
            if (!this.csv.exportKelasId) {
                this.showNotif('error', 'Silakan pilih kelas untuk diekspor.');
                return;
            }
            
            this.csv.isProcessing = true;
            google.script.run
                .withSuccessHandler((response) => {
                    this.csv.isProcessing = false;
                    if (response.status === 'success') {
                        const data = response.data;
                        if (data.length === 0) {
                            this.showNotif('error', 'Tidak ada data siswa di kelas tersebut.');
                            return;
                        }
                        
                        // Generate CSV content
                        let csvContent = 'NIS;NAMA\n';
                        data.forEach(row => {
                            // Ensure no ; inside fields, just in case
                            let nis = (row.nis || '').toString().replace(/;/g, '');
                            let nama = (row.nama || '').toString().replace(/;/g, '');
                            csvContent += `${nis};${nama}\n`;
                        });
                        
                        // Create Blob and download link
                        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                        const link = document.createElement('a');
                        const url = URL.createObjectURL(blob);
                        
                        const kelasObj = this.kelasList.find(k => k.id == this.csv.exportKelasId);
                        const kelasName = kelasObj ? kelasObj.nama_kelas.replace(/\s+/g, '_') : 'Siswa';
                        
                        link.setAttribute('href', url);
                        link.setAttribute('download', `Export_Siswa_${kelasName}.csv`);
                        link.style.visibility = 'hidden';
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        
                        this.showNotif('success', 'File CSV berhasil diekspor.');
                        this.csv.exportKelasId = '';
                    } else {
                        this.showNotif('error', response.message);
                    }
                })
                .withFailureHandler((error) => {
                    this.csv.isProcessing = false;
                    this.showNotif('error', 'Gagal koneksi: ' + error.message);
                })
                .getExportSiswa(localStorage.getItem('spensa_token'), this.csv.exportKelasId);
        },
        
        handleImportCSV() {
            if (!this.csv.importKelasId) {
                this.showNotif('error', 'Silakan pilih kelas untuk import.');
                return;
            }
            
            const fileInput = this.$refs.csvFileInput;
            if (!fileInput.files || fileInput.files.length === 0) {
                this.showNotif('error', 'Silakan pilih file CSV.');
                return;
            }
            
            const file = fileInput.files[0];
            if (!file.name.endsWith('.csv') && !file.name.endsWith('.txt')) {
                this.showNotif('error', 'File harus berformat CSV.');
                return;
            }
            
            this.csv.isProcessing = true;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const text = e.target.result;
                const rows = text.split('\n');
                const parsedData = [];
                
                // Skip header (i=0)
                let separator = ';';
                if (rows.length > 0 && rows[0].includes(',') && !rows[0].includes(';')) {
                    separator = ',';
                }
                
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i].trim();
                    if (!row) continue;
                    
                    const cols = row.split(separator);
                    if (cols.length >= 2) {
                        const nis = cols[0].trim().replace(/^"|"$/g, '');
                        const nama = cols[1].trim().replace(/^"|"$/g, '');
                        if (nis && nama) {
                            parsedData.push({ nis, nama });
                        }
                    }
                }
                
                if (parsedData.length === 0) {
                    this.csv.isProcessing = false;
                    this.showNotif('error', 'Tidak ada data valid yang dapat diimpor. Pastikan format kolom dipisah dengan titik koma (;).');
                    return;
                }
                
                // Send to backend
                google.script.run
                    .withSuccessHandler((response) => {
                        this.csv.isProcessing = false;
                        if (response.status === 'success') {
                            this.showNotif('success', response.message);
                            this.csv.importKelasId = '';
                            fileInput.value = '';
                            this.fetchSiswa(); // Refresh table
                        } else if (response.status === 'validation_error') {
                            let errStr = Object.values(response.errors).flat().join('<br>');
                            this.showNotif('error', '<strong>Gagal:</strong><br>' + errStr);
                        } else {
                            this.showNotif('error', response.message);
                        }
                    })
                    .withFailureHandler((error) => {
                        this.csv.isProcessing = false;
                        this.showNotif('error', 'Gagal koneksi: ' + error.message);
                    })
                    .importSiswaBulk(localStorage.getItem('spensa_token'), this.csv.importKelasId, parsedData);
            };
            
            reader.onerror = () => {
                this.csv.isProcessing = false;
                this.showNotif('error', 'Gagal membaca file.');
            };
            
            reader.readAsText(file);
        }
    }
}
</script>
