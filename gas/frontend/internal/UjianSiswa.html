<!-- ========================================================================= -->
<!-- UJIAN SISWA (PORTAL & LEMBAR PENGERJAAN CBT SISWA)                         -->
<!-- Migrasi 100% Identik dari resources/views/siswa/ujian/*                   -->
<!-- ========================================================================= -->

<div x-cloak x-data="ujianSiswaData()" x-init="initData()" class="space-y-6">

    <!-- Toast Notification -->
    <div x-cloak x-show="notification.show" 
         x-transition:enter="transition ease-out duration-300 transform"
         x-transition:enter-start="opacity-0 translate-y-2"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-200 transform"
         x-transition:leave-start="opacity-100 translate-y-0"
         x-transition:leave-end="opacity-0 translate-y-2"
         :class="notification.type === 'success' ? 'bg-emerald-600 text-white' : 'bg-rose-600 text-white'"
         class="fixed bottom-5 right-5 z-50 px-5 py-3 rounded-2xl shadow-xl flex items-center gap-3 text-xs font-bold">
        <span x-text="notification.message"></span>
        <button @click="notification.show = false" class="text-white/80 hover:text-white">&times;</button>
    </div>

    <!-- ========================================================================= -->
    <!-- VIEW 1: KATALOG DAFTAR UJIAN SISWA                                        -->
    <!-- ========================================================================= -->
    <template x-if="viewMode === 'catalog'">
        <div class="space-y-6">
            
            <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                <div>
                    <h1 class="text-xl font-black text-slate-800 tracking-tight">Portal Ujian Harian (CBT)</h1>
                    <p class="text-xs text-slate-500 font-medium mt-0.5">Daftar paket ujian online untuk kelas Anda.</p>
                </div>
                <button @click="fetchCatalog()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl flex items-center gap-2 transition-all">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Segarkan
                </button>
            </div>

            <!-- Loading Catalog -->
            <div x-show="loadingCatalog" class="flex flex-col items-center justify-center py-16 bg-white rounded-2xl border border-slate-100 shadow-sm">
                <svg class="animate-spin h-8 w-8 text-blue-600 mb-3" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p class="text-xs font-bold text-slate-500">Memeriksa jadwal ujian...</p>
            </div>

            <!-- Empty State -->
            <div x-show="!loadingCatalog && (!ujians || ujians.length === 0)" class="bg-white rounded-2xl border border-dashed border-slate-300 p-16 text-center shadow-xs">
                <div class="w-16 h-16 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                    📝
                </div>
                <h3 class="text-base font-black text-slate-700">Tidak Ada Ujian Aktif</h3>
                <p class="text-xs text-slate-500 max-w-sm mx-auto mt-1">Belum ada paket ujian online yang dijadwalkan aktif untuk kelas Anda saat ini.</p>
            </div>

            <!-- List Grid Ujian -->
            <div x-show="!loadingCatalog && ujians && ujians.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                <template x-for="u in ujians" :key="u.id">
                    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-xs hover:shadow-md transition-all p-5 flex flex-col justify-between space-y-4">
                        <div>
                            <div class="flex items-center justify-between gap-2 mb-2">
                                <span class="text-[10px] font-extrabold uppercase px-2.5 py-0.5 rounded-full bg-blue-100 text-blue-800" x-text="u.bab"></span>
                                <span class="text-[10px] font-bold text-slate-400 flex items-center gap-1">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    <span x-text="`${u.durasi} Menit`"></span>
                                </span>
                            </div>
                            <h3 class="font-black text-slate-800 text-sm leading-snug" x-text="u.judul"></h3>
                        </div>

                        <div class="pt-3 border-t border-slate-100 flex items-center justify-between">
                            <div>
                                <template x-if="u.status_pengerjaan === 'selesai' || u.status_pengerjaan === 'dinilai'">
                                    <span class="text-xs font-black text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-xl border border-emerald-200">
                                        Nilai: <strong x-text="u.nilai_akhir"></strong>
                                    </span>
                                </template>
                                <template x-if="u.status_pengerjaan === 'mengerjakan'">
                                    <span class="text-[10px] font-extrabold text-amber-600 bg-amber-50 px-2 py-0.5 rounded-full border border-amber-200">
                                        Sedang Berlangsung
                                    </span>
                                </template>
                                <template x-if="u.status_pengerjaan === 'belum'">
                                    <span class="text-[10px] font-bold text-slate-400">Siap Dikerjakan</span>
                                </template>
                            </div>

                            <div>
                                <template x-if="u.status_pengerjaan === 'belum'">
                                    <button @click="openTokenModal(u)" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-black shadow-sm transition-all">
                                        Masuk Ujian &rarr;
                                    </button>
                                </template>
                                <template x-if="u.status_pengerjaan === 'mengerjakan'">
                                    <button @click="lanjutUjian(u.id)" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-xl text-xs font-black shadow-sm transition-all animate-pulse">
                                        Lanjutkan &rarr;
                                    </button>
                                </template>
                                <template x-if="u.status_pengerjaan === 'selesai' || u.status_pengerjaan === 'dinilai'">
                                    <span class="text-[10px] font-extrabold text-slate-400 bg-slate-100 px-3 py-1.5 rounded-xl">Sudah Selesai</span>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>
            </div>

        </div>
    </template>

    <!-- ========================================================================= -->
    <!-- VIEW 2: RUANG LEMBAR KERJA CBT (WORKSPACE UJIAN)                          -->
    <!-- ========================================================================= -->
    <template x-if="viewMode === 'exam'">
        <div class="space-y-4">
            
            <!-- Exam Header Bar: Judul, Timer Countdown, Indikator Selesai -->
            <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-4 sticky top-2 z-20 flex flex-wrap items-center justify-between gap-3">
                <div>
                    <span class="text-[10px] font-extrabold uppercase bg-blue-100 text-blue-800 px-2.5 py-0.5 rounded-md" x-text="activeExam.ujian.bab"></span>
                    <h2 class="font-black text-slate-800 text-sm mt-1" x-text="activeExam.ujian.judul"></h2>
                </div>

                <div class="flex items-center gap-4">
                    <!-- Timer Countdown -->
                    <div class="bg-rose-50 border border-rose-200 px-3.5 py-1.5 rounded-xl flex items-center gap-2">
                        <svg class="w-4 h-4 text-rose-600 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span class="font-mono font-black text-sm text-rose-700" x-text="timerDisplay"></span>
                    </div>

                    <!-- Tombol Selesai / Kumpulkan -->
                    <button @click="confirmSubmitModal = true" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-black shadow-md transition-all">
                        Kumpulkan Ujian
                    </button>
                </div>
            </div>

            <!-- Exam Main Content: Soal & Palet Nomor Soal -->
            <div class="grid grid-cols-1 lg:grid-cols-4 gap-4 items-start">
                
                <!-- Left (3 cols): Question Card -->
                <div class="lg:col-span-3 bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 space-y-6">
                    
                    <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                        <span class="font-black text-xs text-blue-800 bg-blue-50 px-3 py-1 rounded-xl border border-blue-100" x-text="`Nomor Soal ${currentSoalIndex + 1} dari ${activeExam.soals.length}`"></span>
                        <span class="text-[10px] font-extrabold uppercase px-2.5 py-0.5 rounded-full" :class="currentSoal.tipe === 'pg' ? 'bg-indigo-100 text-indigo-800' : 'bg-amber-100 text-amber-800'" x-text="currentSoal.tipe === 'pg' ? 'Pilihan Ganda' : 'Essay / Uraian'"></span>
                    </div>

                    <!-- Teks Pertanyaan -->
                    <div class="text-sm font-medium text-slate-800 leading-relaxed whitespace-pre-line" x-text="currentSoal.pertanyaan"></div>

                    <!-- Opsi Jawaban PG -->
                    <template x-if="currentSoal.tipe === 'pg'">
                        <div class="space-y-3 pt-2">
                            <label :class="jawabanModel[currentSoal.id] === 'a' ? 'border-blue-600 bg-blue-50/50 shadow-xs ring-1 ring-blue-500' : 'border-slate-200 hover:bg-slate-50'" class="flex items-start gap-3 p-3.5 rounded-2xl border cursor-pointer transition-all">
                                <input type="radio" :name="`soal_${currentSoal.id}`" value="a" x-model="jawabanModel[currentSoal.id]" @change="autoSaveCurrent()" class="mt-0.5 text-blue-600">
                                <div class="text-xs font-semibold text-slate-800"><strong class="mr-1">A.</strong> <span x-text="currentSoal.opsi_a"></span></div>
                            </label>

                            <label :class="jawabanModel[currentSoal.id] === 'b' ? 'border-blue-600 bg-blue-50/50 shadow-xs ring-1 ring-blue-500' : 'border-slate-200 hover:bg-slate-50'" class="flex items-start gap-3 p-3.5 rounded-2xl border cursor-pointer transition-all">
                                <input type="radio" :name="`soal_${currentSoal.id}`" value="b" x-model="jawabanModel[currentSoal.id]" @change="autoSaveCurrent()" class="mt-0.5 text-blue-600">
                                <div class="text-xs font-semibold text-slate-800"><strong class="mr-1">B.</strong> <span x-text="currentSoal.opsi_b"></span></div>
                            </label>

                            <label :class="jawabanModel[currentSoal.id] === 'c' ? 'border-blue-600 bg-blue-50/50 shadow-xs ring-1 ring-blue-500' : 'border-slate-200 hover:bg-slate-50'" class="flex items-start gap-3 p-3.5 rounded-2xl border cursor-pointer transition-all">
                                <input type="radio" :name="`soal_${currentSoal.id}`" value="c" x-model="jawabanModel[currentSoal.id]" @change="autoSaveCurrent()" class="mt-0.5 text-blue-600">
                                <div class="text-xs font-semibold text-slate-800"><strong class="mr-1">C.</strong> <span x-text="currentSoal.opsi_c"></span></div>
                            </label>

                            <label :class="jawabanModel[currentSoal.id] === 'd' ? 'border-blue-600 bg-blue-50/50 shadow-xs ring-1 ring-blue-500' : 'border-slate-200 hover:bg-slate-50'" class="flex items-start gap-3 p-3.5 rounded-2xl border cursor-pointer transition-all">
                                <input type="radio" :name="`soal_${currentSoal.id}`" value="d" x-model="jawabanModel[currentSoal.id]" @change="autoSaveCurrent()" class="mt-0.5 text-blue-600">
                                <div class="text-xs font-semibold text-slate-800"><strong class="mr-1">D.</strong> <span x-text="currentSoal.opsi_d"></span></div>
                            </label>
                        </div>
                    </template>

                    <!-- Input Jawaban Essay -->
                    <template x-if="currentSoal.tipe === 'essay'">
                        <div class="space-y-2 pt-2">
                            <label class="block text-xs font-bold text-slate-700">Tulis Jawaban Uraian Anda:</label>
                            <textarea x-model="jawabanModel[currentSoal.id]" @blur="autoSaveCurrent()" rows="6" placeholder="Ketikkan jawaban essay secara lengkap di sini..." class="w-full bg-slate-50 border border-slate-300 rounded-2xl p-4 text-xs font-medium leading-relaxed text-slate-800 focus:ring-2 focus:ring-blue-500"></textarea>
                            <p class="text-[10px] text-slate-400">* Jawaban essay akan otomatis tersimpan saat Anda berpindah soal.</p>
                        </div>
                    </template>

                    <!-- Navigasi Bawah (Sebelumnya / Selanjutnya) -->
                    <div class="flex items-center justify-between pt-4 border-t border-slate-100">
                        <button type="button" :disabled="currentSoalIndex === 0" @click="prevSoal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition-all disabled:opacity-30">
                            &larr; Soal Sebelumnya
                        </button>
                        <button type="button" :disabled="currentSoalIndex === activeExam.soals.length - 1" @click="nextSoal()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold transition-all disabled:opacity-30">
                            Soal Selanjutnya &rarr;
                        </button>
                    </div>

                </div>

                <!-- Right (1 col): Palette Navigation -->
                <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-5 space-y-4">
                    <h3 class="text-xs font-black text-slate-800 uppercase tracking-wider">Navigasi Butir Soal</h3>
                    
                    <div class="grid grid-cols-5 gap-2">
                        <template x-for="(s, idx) in activeExam.soals" :key="s.id">
                            <button @click="currentSoalIndex = idx" :class="{
                                'ring-2 ring-blue-600 scale-105 font-black': currentSoalIndex === idx,
                                'bg-blue-600 text-white': jawabanModel[s.id] && jawabanModel[s.id].trim() !== '' && currentSoalIndex !== idx,
                                'bg-slate-100 text-slate-600 hover:bg-slate-200': (!jawabanModel[s.id] || jawabanModel[s.id].trim() === '') && currentSoalIndex !== idx
                            }" class="h-10 rounded-xl text-xs font-extrabold flex items-center justify-center transition-all">
                                <span x-text="idx + 1"></span>
                            </button>
                        </template>
                    </div>

                    <div class="pt-3 border-t border-slate-100 text-[10px] space-y-1.5 font-bold text-slate-500">
                        <div class="flex items-center gap-2">
                            <span class="w-3 h-3 rounded bg-blue-600"></span> Sudah dijawab
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="w-3 h-3 rounded bg-slate-100 border border-slate-300"></span> Belum dijawab
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </template>

    <!-- ========================================================================= -->
    <!-- VIEW 3: HASIL PENGERJAAN UJIAN (SELESAI)                                  -->
    <!-- ========================================================================= -->
    <template x-if="viewMode === 'result'">
        <div class="max-w-md mx-auto bg-white rounded-2xl border border-slate-200/80 shadow-xl p-8 text-center space-y-6">
            <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-3xl shadow-inner">
                🎉
            </div>

            <div>
                <span class="text-[10px] font-extrabold uppercase tracking-widest text-emerald-700 bg-emerald-50 px-3 py-1 rounded-full border border-emerald-200">Ujian Telah Selesai</span>
                <h2 class="text-xl font-black text-slate-800 mt-2">Terima Kasih!</h2>
                <p class="text-xs text-slate-500 mt-1">Jawaban ujian Anda telah berhasil terekam di sistem akademik.</p>
            </div>

            <div class="bg-slate-50 border border-slate-200 rounded-2xl p-5">
                <span class="text-[10px] font-bold text-slate-400 uppercase block">Skor Pilihan Ganda (PG)</span>
                <span class="text-4xl font-black text-slate-800 block my-1" x-text="resultData.nilai_pg"></span>
                <template x-if="resultData.has_essay">
                    <p class="text-[10px] font-bold text-amber-600 mt-1">* Terdapat soal Essay yang akan dinilai manual oleh Guru.</p>
                </template>
            </div>

            <button @click="backToCatalog()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-black shadow-md transition-all">
                Kembali ke Katalog Ujian
            </button>
        </div>
    </template>

    <!-- ========================================================================= -->
    <!-- MODAL: MASUKKAN TOKEN UJIAN                                               -->
    <!-- ========================================================================= -->
    <div x-cloak x-show="tokenModal" class="fixed inset-0 z-50 overflow-y-auto bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 shadow-2xl w-full max-w-sm border border-slate-100" @click.away="tokenModal = false">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
                <h3 class="font-black text-slate-800 text-sm">Masukkan Token Ujian</h3>
                <button @click="tokenModal = false" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <form @submit.prevent="submitTokenMasuk" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Token 6 Karakter</label>
                    <input type="text" maxlength="6" x-model="inputToken" required placeholder="Contoh: AB12CD" class="w-full uppercase text-center font-mono font-black text-lg tracking-widest bg-slate-50 border border-slate-300 rounded-xl py-2.5 focus:ring-2 focus:ring-blue-500">
                    <p class="text-[10px] text-slate-400 mt-1">Minta token ujian kepada Guru Pengampu di kelas.</p>
                </div>

                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" @click="tokenModal = false" class="px-4 py-2 text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl">Batal</button>
                    <button type="submit" :disabled="loadingSubmit" class="px-5 py-2 text-xs font-black text-white bg-blue-600 hover:bg-blue-700 rounded-xl shadow-md disabled:opacity-70">
                        <span x-show="!loadingSubmit">Mulai Mengerjakan</span>
                        <span x-show="loadingSubmit">Memverifikasi...</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- ========================================================================= -->
    <!-- MODAL: KONFIRMASI KUMPULKAN UJIAN                                         -->
    <!-- ========================================================================= -->
    <div x-cloak x-show="confirmSubmitModal" class="fixed inset-0 z-50 overflow-y-auto bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 shadow-2xl w-full max-w-sm border border-slate-100 text-center space-y-4" @click.away="confirmSubmitModal = false">
            <div class="w-12 h-12 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold">
                ⚠️
            </div>
            
            <div>
                <h3 class="font-black text-slate-800 text-sm">Kumpulkan Ujian Sekarang?</h3>
                <p class="text-xs text-slate-500 mt-1">Pastikan seluruh nomor soal telah dijawab dengan teliti. Setelah dikumpulkan, Anda tidak dapat mengubah jawaban lagi.</p>
            </div>

            <div class="flex justify-center gap-2 pt-2">
                <button type="button" @click="confirmSubmitModal = false" class="px-4 py-2 text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl">Periksa Kembali</button>
                <button type="button" :disabled="loadingSubmit" @click="executeSubmitUjian()" class="px-5 py-2 text-xs font-black text-white bg-emerald-600 hover:bg-emerald-700 rounded-xl shadow-md disabled:opacity-70">
                    <span x-show="!loadingSubmit">Ya, Kumpulkan</span>
                    <span x-show="loadingSubmit">Mengumpulkan...</span>
                </button>
            </div>
        </div>
    </div>

</div>

<!-- LOGIC ALPINE JS -->
<script>
function ujianSiswaData() {
    return {
        viewMode: 'catalog', // 'catalog', 'exam', 'result'
        loadingCatalog: true,
        loadingSubmit: false,
        tokenModal: false,
        confirmSubmitModal: false,
        inputToken: '',
        targetUjian: null,
        ujians: [],

        // State Exam
        activeExam: { ujian: {}, soals: [], hasil: {} },
        jawabanModel: {},
        currentSoalIndex: 0,
        timerInterval: null,
        remainingSeconds: 0,
        timerDisplay: '00:00',

        // Result State
        resultData: { nilai_pg: 0, has_essay: false },

        notification: { show: false, type: 'success', message: '' },

        showNotif(type, message) {
            this.notification.show = true;
            this.notification.type = type;
            this.notification.message = message;
            setTimeout(() => { this.notification.show = false; }, 5000);
        },

        get currentSoal() {
            if (this.activeExam.soals && this.activeExam.soals.length > 0) {
                return this.activeExam.soals[this.currentSoalIndex] || {};
            }
            return {};
        },

        initData() {
            this.fetchCatalog();
            this.initAntiCheat();
        },

        fetchCatalog() {
            this.loadingCatalog = true;
            var token = localStorage.getItem('spensa_token') || (new URLSearchParams(window.location.search)).get('token') || '';
            if (token) {
                localStorage.setItem('spensa_token', token);
            } else {
                this.loadingCatalog = false;
                return;
            }

            google.script.run
                .withSuccessHandler((response) => {
                    this.loadingCatalog = false;
                    if (response && response.status === 'success') {
                        this.ujians = response.data.ujians || [];
                    }
                })
                .withFailureHandler((error) => {
                    this.loadingCatalog = false;
                })
                .getUjianSiswaList(token);
        },

        openTokenModal(ujian) {
            this.targetUjian = ujian;
            this.inputToken = '';
            this.tokenModal = true;
        },

        submitTokenMasuk() {
            var token = localStorage.getItem('spensa_token');
            if (!token || !this.targetUjian) return;

            this.loadingSubmit = true;
            google.script.run
                .withSuccessHandler((response) => {
                    this.loadingSubmit = false;
                    if (response && response.status === 'success') {
                        this.tokenModal = false;
                        this.lanjutUjian(this.targetUjian.id);
                    } else {
                        this.showNotif('error', response ? response.message : 'Token salah');
                    }
                })
                .withFailureHandler((error) => {
                    this.loadingSubmit = false;
                    this.showNotif('error', error.message);
                })
                .masukUjianSiswa(token, this.targetUjian.id, this.inputToken);
        },

        lanjutUjian(ujianId) {
            var token = localStorage.getItem('spensa_token');
            if (!token) return;

            this.loadingCatalog = true;
            google.script.run
                .withSuccessHandler((response) => {
                    this.loadingCatalog = false;
                    if (response && response.status === 'success') {
                        this.activeExam = response.data;
                        this.jawabanModel = response.data.jawaban_tersimpan || {};
                        this.currentSoalIndex = 0;
                        this.startTimer(response.data.ujian.durasi, response.data.ujian.started_at);
                        this.viewMode = 'exam';
                    } else {
                        this.showNotif('error', response ? response.message : 'Gagal memuat soal');
                    }
                })
                .withFailureHandler((error) => {
                    this.loadingCatalog = false;
                    this.showNotif('error', error.message);
                })
                .getSoalUjianSiswa(token, ujianId);
        },

        startTimer(durasiMenit, startedAt) {
            if (this.timerInterval) clearInterval(this.timerInterval);

            var totalSec = (parseInt(durasiMenit) || 60) * 60;
            if (startedAt) {
                var elapsedSec = Math.floor((new Date().getTime() - new Date(startedAt).getTime()) / 1000);
                totalSec = Math.max(0, totalSec - elapsedSec);
            }
            this.remainingSeconds = totalSec;

            this.updateTimerDisplay();

            this.timerInterval = setInterval(() => {
                if (this.remainingSeconds <= 0) {
                    clearInterval(this.timerInterval);
                    this.showNotif('error', 'Waktu ujian telah habis! Jawaban Anda otomatis dikumpulkan.');
                    this.executeSubmitUjian();
                } else {
                    this.remainingSeconds--;
                    this.updateTimerDisplay();
                }
            }, 1000);
        },

        updateTimerDisplay() {
            var m = Math.floor(this.remainingSeconds / 60);
            var s = this.remainingSeconds % 60;
            this.timerDisplay = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
        },

        prevSoal() {
            if (this.currentSoalIndex > 0) this.currentSoalIndex--;
        },

        nextSoal() {
            if (this.currentSoalIndex < this.activeExam.soals.length - 1) this.currentSoalIndex++;
        },

        autoSaveCurrent() {
            var token = localStorage.getItem('spensa_token');
            if (!token || !this.activeExam.ujian.id) return;

            google.script.run
                .simpanJawabanSiswa(token, this.activeExam.ujian.id, this.jawabanModel);
        },

        executeSubmitUjian() {
            var token = localStorage.getItem('spensa_token');
            if (!token || !this.activeExam.ujian.id) return;

            if (this.timerInterval) clearInterval(this.timerInterval);
            this.loadingSubmit = true;

            google.script.run
                .withSuccessHandler((response) => {
                    this.loadingSubmit = false;
                    this.confirmSubmitModal = false;
                    if (response && response.status === 'success') {
                        this.resultData = response.data;
                        this.viewMode = 'result';
                    } else {
                        this.showNotif('error', response ? response.message : 'Gagal mengumpulkan');
                    }
                })
                .withFailureHandler((error) => {
                    this.loadingSubmit = false;
                    this.confirmSubmitModal = false;
                    this.showNotif('error', error.message);
                })
                .submitUjianSiswa(token, this.activeExam.ujian.id, this.jawabanModel);
        },

        backToCatalog() {
            this.viewMode = 'catalog';
            this.fetchCatalog();
        },

        initAntiCheat() {
            document.addEventListener("visibilitychange", () => {
                if (document.hidden && this.viewMode === 'exam') {
                    var token = localStorage.getItem('spensa_token');
                    if (token && this.activeExam.ujian.id) {
                        google.script.run.logKecuranganUjian(token, this.activeExam.ujian.id, 'tab_switch', 'Siswa keluar atau berpindah tab');
                    }
                }
            });
        }
    }
}
</script>
