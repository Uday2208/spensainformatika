<!-- PenilaianHarian.html -->
<div x-data="penilaianHarianData()" x-init="initPenilaian()" class="space-y-6">

    <!-- BANNER INFO UTAMA -->
    <div class="flex items-start gap-4 bg-gradient-to-r from-blue-900 to-indigo-900 rounded-2xl p-5 mb-5 shadow-xl relative overflow-hidden">
        <div class="absolute inset-0 opacity-10">
            <div class="absolute top-0 right-0 w-48 h-48 bg-white rounded-full -translate-y-24 translate-x-24"></div>
        </div>
        <div class="w-12 h-12 bg-amber-400 rounded-2xl flex items-center justify-center flex-shrink-0 shadow-lg relative">
            <svg class="w-7 h-7 text-amber-900" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
        </div>
        <div class="relative flex-1 min-w-0">
            <h2 class="text-white font-bold text-base leading-tight">Halaman Input Nilai Keaktifan</h2>
            <p class="text-blue-200 text-xs mt-1 leading-relaxed">
                Halaman ini digunakan untuk <strong class="text-amber-300">mengisi nilai keaktifan harian</strong> siswa berdasarkan kelas dan pertemuan.
            </p>
        </div>
    </div>

    <!-- NOTIFIKASI -->
    <template x-if="notification.show">
        <div :class="notification.type === 'success' ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-red-50 border-red-200 text-red-800'" class="mb-4 flex items-center gap-3 border p-4 rounded-2xl shadow-sm">
            <div :class="notification.type === 'success' ? 'bg-emerald-500' : 'bg-red-500'" class="w-7 h-7 rounded-full flex items-center justify-center flex-shrink-0">
                <svg x-show="notification.type === 'success'" class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                <svg x-show="notification.type === 'error'" class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </div>
            <p class="font-semibold text-sm" x-text="notification.message"></p>
            <button @click="notification.show = false" class="ml-auto text-current opacity-50 hover:opacity-100">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
    </template>

    <!-- FILTER FORM -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 mb-5 relative">
        <!-- Loader Filter -->
        <div x-show="loadingInit" class="absolute inset-0 bg-white/80 z-10 rounded-2xl flex items-center justify-center">
            <svg class="animate-spin h-6 w-6 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        </div>

        <div class="flex items-center gap-2 mb-4">
            <div class="w-6 h-6 bg-slate-100 rounded-lg flex items-center justify-center">
                <svg class="w-3.5 h-3.5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
            </div>
            <h3 class="font-bold text-slate-700 text-sm">Filter Kelas & Pertemuan</h3>
        </div>
        
        <form @submit.prevent="fetchData" class="grid grid-cols-1 sm:grid-cols-4 gap-3">
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1.5 uppercase tracking-wide">Pilih Kelas</label>
                <select x-model="form.kelas_id" class="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100 transition-all cursor-pointer min-h-[44px]" required>
                    <option value="">-- Pilih Kelas --</option>
                    <template x-for="k in listKelas" :key="k.id">
                        <option :value="k.id" x-text="k.nama_kelas"></option>
                    </template>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1.5 uppercase tracking-wide">Tanggal</label>
                <input type="date" x-model="form.tanggal" class="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100 transition-all min-h-[44px]" required>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1.5 uppercase tracking-wide">Pertemuan ke-</label>
                <input type="text" x-model="form.pertemuan" placeholder="Misal: 1 atau Bab 1" class="w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100 transition-all min-h-[44px]" required>
            </div>
            <div class="flex items-end">
                <button type="submit" :disabled="loadingData" class="w-full flex items-center justify-center gap-2 px-5 py-2.5 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold text-sm rounded-xl shadow-md shadow-blue-500/25 transition-all min-h-[44px] disabled:opacity-70 disabled:cursor-not-allowed">
                    <span x-show="!loadingData">Tampilkan Siswa</span>
                    <svg x-show="loadingData" class="animate-spin w-4 h-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                </button>
            </div>
        </form>
    </div>

    <!-- CONTENT AREA -->
    <template x-if="hasFetched">
        <div>
            <!-- VALIDASI ABSENSI BELUM DIISI -->
            <template x-if="absensiBelumDiisi">
                <div class="p-8 bg-amber-50 border border-amber-200 rounded-2xl shadow-sm mb-6 flex flex-col items-center justify-center text-center">
                    <div class="w-12 h-12 bg-amber-100 rounded-2xl flex items-center justify-center mb-3">
                        <svg class="w-6 h-6 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    </div>
                    <h3 class="text-base font-bold text-amber-800 mb-1">Absensi Belum Diisi untuk Tanggal & Kelas Ini!</h3>
                    <p class="text-xs text-amber-700 max-w-md leading-relaxed">
                        Anda harus mengisi kehadiran siswa terlebih dahulu pada tanggal ini sebelum memberikan nilai keaktifan harian.
                    </p>
                    <div class="mt-4 flex gap-3">
                        <button @click.prevent="navigate('absensi')" class="px-5 py-2.5 bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold rounded-xl shadow-md transition-all active:scale-95">
                            Koreksi Absensi Terlebih Dahulu
                        </button>
                    </div>
                </div>
            </template>
            
            <!-- EMPTY STATE SISWA -->
            <template x-if="!absensiBelumDiisi && siswas.length === 0">
                <div class="p-16 text-center text-slate-400 bg-white rounded-2xl border border-slate-200 shadow-sm">
                    <svg class="w-12 h-12 mx-auto mb-3 text-slate-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    <p class="font-medium">Tidak ada data siswa untuk kelas ini.</p>
                </div>
            </template>

            <!-- DAFTAR KEAKTIFAN SISWA -->
            <template x-if="!absensiBelumDiisi && siswas.length > 0">
                <div>
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
                        <div>
                            <h3 class="font-bold text-slate-700 text-sm">Daftar Keaktifan Siswa</h3>
                            <p class="text-xs text-slate-400 mt-0.5">Pertemuan: <strong x-text="form.pertemuan"></strong> | Tanggal: <strong x-text="form.tanggal"></strong></p>
                        </div>
                    </div>

                    <form @submit.prevent="saveData">
                        <div class="bg-white rounded border border-slate-200 shadow-sm overflow-hidden mb-6">
                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse table-compact">
                                    <thead>
                                        <tr class="bg-slate-50 border-b border-slate-200">
                                            <th class="w-12 text-center px-4 py-3 text-xs font-bold text-slate-500 uppercase tracking-wide">No</th>
                                            <th class="w-28 px-4 py-3 text-xs font-bold text-slate-500 uppercase tracking-wide">NIS</th>
                                            <th class="px-4 py-3 text-xs font-bold text-slate-500 uppercase tracking-wide">Nama Siswa</th>
                                            <th class="w-32 px-4 py-3 text-center text-xs font-bold text-slate-500 uppercase tracking-wide">Kehadiran</th>
                                            <th class="w-40 px-4 py-3 text-center text-xs font-bold text-slate-500 uppercase tracking-wide">Nilai Keaktifan</th>
                                            <th class="px-4 py-3 text-xs font-bold text-slate-500 uppercase tracking-wide">Catatan Keaktifan</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-100">
                                        <template x-for="(siswa, index) in siswas" :key="siswa.id">
                                            <tr class="hover:bg-slate-50/50 transition-colors" :class="!siswa.isHadir ? 'bg-slate-50/30 opacity-70' : ''">
                                                <td class="text-center text-slate-500 px-4 py-3 text-sm" x-text="index + 1"></td>
                                                <td class="font-mono text-slate-600 text-xs px-4 py-3" x-text="siswa.nis"></td>
                                                <td class="font-semibold text-slate-800 text-sm px-4 py-3" x-text="siswa.nama"></td>
                                                <td class="text-center px-4 py-3">
                                                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-bold border uppercase"
                                                          :class="{
                                                            'bg-emerald-50 text-emerald-700 border-emerald-200': siswa.absensiStatus === 'hadir',
                                                            'bg-amber-50 text-amber-700 border-amber-200': siswa.absensiStatus === 'sakit',
                                                            'bg-blue-50 text-blue-700 border-blue-200': siswa.absensiStatus === 'izin',
                                                            'bg-purple-50 text-purple-700 border-purple-200': siswa.absensiStatus === 'dispen',
                                                            'bg-red-50 text-red-700 border-red-200': siswa.absensiStatus === 'alpha'
                                                          }"
                                                          x-text="siswa.absensiStatus === 'alpha' ? 'Alpa' : siswa.absensiStatus">
                                                    </span>
                                                </td>
                                                <td class="text-center px-4 py-3">
                                                    <select x-model.number="siswa.nilai" class="w-full text-xs font-semibold bg-white border border-slate-300 rounded px-2 py-1.5 focus:outline-none focus:border-blue-400 cursor-pointer min-h-[32px]" :class="!siswa.isHadir ? 'bg-slate-100 text-slate-500' : ''">
                                                        <option value="60">Pasif (60)</option>
                                                        <option value="70">Tidak Hadir (70)</option>
                                                        <option value="80">Hadir (80)</option>
                                                        <option value="90">Aktif (90)</option>
                                                        <option value="100">Sangat Aktif (100)</option>
                                                    </select>
                                                </td>
                                                <td class="px-4 py-3">
                                                    <input type="text" x-model="siswa.catatan" placeholder="💬 Catatan keaktifan siswa..." 
                                                           class="w-full text-xs py-1.5 px-3 rounded-lg bg-slate-50 border border-slate-200 focus:outline-none focus:border-blue-400 focus:bg-white transition-colors">
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div class="flex justify-end relative">
                            <div x-show="loadingSave" class="absolute inset-0 bg-white/50 z-10 rounded-xl flex items-center justify-center"></div>
                            <button type="submit" :disabled="loadingSave" class="w-full lg:w-auto px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm rounded-xl shadow-md transition-all active:scale-95 flex items-center justify-center min-h-[44px] disabled:opacity-70 disabled:cursor-not-allowed">
                                <span x-show="!loadingSave" class="flex items-center">
                                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                                    SIMPAN PENILAIAN
                                </span>
                                <span x-show="loadingSave" class="flex items-center">
                                    <svg class="animate-spin w-4 h-4 mr-2 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                    Menyimpan...
                                </span>
                            </button>
                        </div>
                    </form>
                </div>
            </template>
        </div>
    </template>

</div>

<script>
function penilaianHarianData() {
    return {
        loadingInit: true,
        loadingData: false,
        loadingSave: false,
        hasFetched: false,
        
        listKelas: [],
        
        form: {
            kelas_id: '',
            tanggal: new Date().toISOString().split('T')[0],
            pertemuan: '1'
        },
        
        absensiBelumDiisi: false,
        siswas: [],
        
        notification: {
            show: false,
            type: '',
            message: ''
        },
        
        showNotif(type, message) {
            this.notification = { show: true, type, message };
            setTimeout(() => { this.notification.show = false; }, 5000);
        },
        
        initPenilaian() {
            this.loadingInit = true;
            google.script.run
                .withSuccessHandler(response => {
                    this.loadingInit = false;
                    if (response.status === 'success') {
                        this.listKelas = response.data.kelas || [];
                    } else {
                        this.showNotif('error', response.message);
                    }
                })
                .withFailureHandler(error => {
                    this.loadingInit = false;
                    this.showNotif('error', error.message || 'Gagal memuat data awal');
                })
                .getPenilaianInit(localStorage.getItem('spensa_token'));
        },
        
        fetchData() {
            if (!this.form.kelas_id || !this.form.tanggal || !this.form.pertemuan) return;
            
            this.loadingData = true;
            this.hasFetched = false;
            
            google.script.run
                .withSuccessHandler(response => {
                    this.loadingData = false;
                    this.hasFetched = true;
                    if (response.status === 'success') {
                        this.absensiBelumDiisi = response.data.absensi_belum_diisi;
                        this.siswas = response.data.siswas || [];
                    } else {
                        this.showNotif('error', response.message);
                    }
                })
                .withFailureHandler(error => {
                    this.loadingData = false;
                    this.showNotif('error', error.message || 'Gagal memuat data siswa');
                })
                .getPenilaianData(localStorage.getItem('spensa_token'), this.form.kelas_id, this.form.tanggal, this.form.pertemuan);
        },
        
        saveData() {
            if (this.siswas.length === 0) return;
            
            this.loadingSave = true;
            
            // Format payload to match backend expectation
            const nilaiPayload = this.siswas.map(s => ({
                siswa_id: s.id,
                nilai: s.nilai,
                catatan: s.catatan
            }));
            
            const payload = {
                kelas_id: this.form.kelas_id,
                tanggal: this.form.tanggal,
                pertemuan: this.form.pertemuan,
                nilai: nilaiPayload
            };
            
            google.script.run
                .withSuccessHandler(response => {
                    this.loadingSave = false;
                    if (response.status === 'success') {
                        this.showNotif('success', response.message || 'Penilaian berhasil disimpan!');
                        // Scroll to top to see notification
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    } else {
                        this.showNotif('error', response.message);
                    }
                })
                .withFailureHandler(error => {
                    this.loadingSave = false;
                    this.showNotif('error', error.message || 'Gagal menyimpan penilaian');
                })
                .storePenilaian(localStorage.getItem('spensa_token'), payload);
        }
    };
}
</script>
