<!-- 
    DataKelas.html 
    Migrasi dari resources/views/guru/data-kelas.blade.php 
-->
<div x-data="kelasController()" x-init="fetchKelas()" class="p-4 sm:p-6 pb-24">

    <!-- Notifikasi -->
    <template x-if="notif.show">
        <div :class="notif.type === 'success' ? 'bg-green-100 text-green-800 border-green-200' : 'bg-red-100 text-red-800 border-red-200'" class="mb-4 p-3 rounded-lg text-sm border shadow-sm flex items-start gap-2">
            <svg x-show="notif.type === 'success'" class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <svg x-show="notif.type === 'error'" class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span x-html="notif.message" class="mt-0.5"></span>
        </div>
    </template>

    <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">
        <!-- Form Tambah Kelas -->
        <div class="lg:col-span-1">
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 sticky top-4">
                <h3 class="font-bold text-slate-800 mb-4 pb-3 border-b border-slate-100 text-sm flex items-center gap-2">
                    <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                    Tambah Kelas Baru
                </h3>
                
                <form @submit.prevent="submitKelas" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1.5">Nama Kelas <span class="text-red-500">*</span></label>
                        <input type="text" x-model="form.nama_kelas" required placeholder="Contoh: VII A" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-colors" :disabled="isLoading">
                    </div>
                    
                    <div class="pt-2">
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg shadow-sm text-sm transition-colors flex items-center justify-center gap-2" :disabled="isLoading">
                            <span x-show="!isLoading">Simpan Kelas</span>
                            <span x-show="isLoading" class="flex items-center gap-2">
                                <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                Memproses...
                            </span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabel Daftar Kelas -->
        <div class="lg:col-span-3">
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-0 overflow-hidden">
                <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                    <div>
                        <h3 class="font-bold text-slate-800 text-base">Daftar Kelas</h3>
                        <p class="text-xs text-slate-500 mt-0.5">Total <span x-text="kelasList.length" class="font-semibold text-blue-600"></span> kelas terdaftar</p>
                    </div>
                    <button @click="fetchKelas()" class="p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors" title="Refresh Data">
                        <svg class="w-4 h-4" :class="{'animate-spin': isFetching}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    </button>
                </div>

                <!-- Loading State -->
                <div x-show="isFetching" class="p-12 text-center">
                    <svg class="animate-spin h-8 w-8 text-blue-500 mx-auto mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    <p class="text-sm text-slate-500">Memuat data kelas...</p>
                </div>

                <!-- Empty State -->
                <div x-show="!isFetching && kelasList.length === 0" class="p-12 text-center">
                    <div class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-4 border border-slate-100">
                        <svg class="w-8 h-8 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                    </div>
                    <h4 class="text-sm font-semibold text-slate-700 mb-1">Belum Ada Kelas</h4>
                    <p class="text-xs text-slate-500 max-w-sm mx-auto">Silakan tambahkan kelas baru melalui form di samping kiri.</p>
                </div>

                <!-- Data Table -->
                <div x-show="!isFetching && kelasList.length > 0" class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 border-b border-slate-200">
                                <th class="py-3 px-4 text-xs font-semibold text-slate-500 uppercase tracking-wider w-16 text-center">ID</th>
                                <th class="py-3 px-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">Nama Kelas</th>
                                <th class="py-3 px-4 text-xs font-semibold text-slate-500 uppercase tracking-wider text-center">Jumlah Siswa</th>
                                <th class="py-3 px-4 text-xs font-semibold text-slate-500 uppercase tracking-wider w-24 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            <template x-for="kelas in kelasList" :key="kelas.id">
                                <tr class="hover:bg-blue-50/50 transition-colors group">
                                    <td class="py-3 px-4 text-center text-xs font-mono text-slate-400" x-text="kelas.id"></td>
                                    <td class="py-3 px-4">
                                        <div class="font-semibold text-slate-800" x-text="kelas.nama_kelas"></div>
                                    </td>
                                    <td class="py-3 px-4 text-center">
                                        <span class="inline-flex items-center justify-center px-2 py-1 rounded-md text-xs font-medium" :class="kelas.jumlah_siswa > 0 ? 'bg-blue-50 text-blue-700 border border-blue-100' : 'bg-slate-100 text-slate-500 border border-slate-200'" x-text="kelas.jumlah_siswa + ' Siswa'"></span>
                                    </td>
                                    <td class="py-3 px-4 text-center">
                                        <button @click="deleteKelas(kelas.id, kelas.nama_kelas)" class="text-slate-400 hover:text-red-600 hover:bg-red-50 p-1.5 rounded-lg transition-colors opacity-0 group-hover:opacity-100 focus:opacity-100" title="Hapus Kelas">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                        </button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function kelasController() {
    return {
        isFetching: true,
        isLoading: false,
        kelasList: [],
        form: {
            nama_kelas: ''
        },
        notif: {
            show: false,
            type: '',
            message: ''
        },
        
        showNotif(type, message) {
            this.notif = { show: true, type, message };
            setTimeout(() => { this.notif.show = false; }, 5000);
        },

        fetchKelas() {
            this.isFetching = true;
            google.script.run
                .withSuccessHandler((response) => {
                    this.isFetching = false;
                    if (response.status === 'success') {
                        this.kelasList = response.data;
                    } else if (response.status === 'unauthorized') {
                        window.top.location.href = "<?= scriptUrl ?>?page=login";
                    } else {
                        this.showNotif('error', response.message);
                    }
                })
                .withFailureHandler((error) => {
                    this.isFetching = false;
                    this.showNotif('error', 'Gagal terhubung ke server: ' + error.message);
                })
                .getDataKelas(localStorage.getItem('spensa_token'));
        },

        submitKelas() {
            if (!this.form.nama_kelas) return;
            
            this.isLoading = true;
            google.script.run
                .withSuccessHandler((response) => {
                    this.isLoading = false;
                    if (response.status === 'success') {
                        this.showNotif('success', response.message);
                        this.form.nama_kelas = '';
                        this.fetchKelas();
                    } else if (response.status === 'validation_error') {
                        let errStr = Object.values(response.errors).flat().join('<br>');
                        this.showNotif('error', '<strong>Validasi Gagal:</strong><br>' + errStr);
                    } else if (response.status === 'unauthorized') {
                        window.top.location.href = "<?= scriptUrl ?>?page=login";
                    } else {
                        this.showNotif('error', response.message);
                    }
                })
                .withFailureHandler((error) => {
                    this.isLoading = false;
                    this.showNotif('error', 'Gagal terhubung ke server: ' + error.message);
                })
                .storeKelas(localStorage.getItem('spensa_token'), this.form);
        },

        deleteKelas(id, nama) {
            if (!confirm(`Menghapus kelas "${nama}" akan menghapus seluruh data siswa di dalamnya beserta nilai dan absensi mereka!\n\nApakah Anda sangat yakin?`)) {
                return;
            }
            
            this.isFetching = true; // Use fetching state to show loading on table
            google.script.run
                .withSuccessHandler((response) => {
                    if (response.status === 'success') {
                        this.showNotif('success', response.message);
                        this.fetchKelas();
                    } else {
                        this.isFetching = false;
                        this.showNotif('error', response.message);
                    }
                })
                .withFailureHandler((error) => {
                    this.isFetching = false;
                    this.showNotif('error', 'Gagal terhubung ke server: ' + error.message);
                })
                .deleteKelas(localStorage.getItem('spensa_token'), id);
        }
    }
}
</script>
