<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Akademik</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Custom compact styling */
        body { background-color: #f8fafc; color: #334155; font-family: 'Inter', sans-serif; }
        [x-cloak] { display: none !important; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Custom slim scrollbar for sidebar */
        .sidebar-scroll::-webkit-scrollbar { width: 5px; }
        .sidebar-scroll::-webkit-scrollbar-track { background: transparent; }
        .sidebar-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
        .sidebar-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }
        .sidebar-scroll { scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.2) transparent; }
        
        /* GAS Specific Reset */
        html, body { margin: 0; padding: 0; height: 100%; }
    </style>
</head>
<body class="antialiased bg-slate-50 flex h-screen overflow-hidden" x-data="appController()">

    <!-- Overlay -->
    <div x-cloak x-show="sidebarOpen" 
         x-transition:enter="transition-opacity ease-linear duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition-opacity ease-linear duration-300"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         @click="sidebarOpen = false" 
         class="fixed inset-0 bg-black/50 z-40 lg:hidden backdrop-blur-sm"></div>

    <!-- Sidebar -->
    <div :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'" 
         class="fixed inset-y-0 left-0 z-50 w-[260px] bg-gradient-to-b from-blue-900 to-blue-800 text-white transform transition-transform duration-300 ease-in-out lg:translate-x-0 lg:static lg:inset-auto lg:flex lg:h-screen lg:w-[260px] lg:flex-col shadow-2xl">
        
        <!-- Sidebar Header -->
        <div class="flex items-center justify-between h-[60px] px-6 bg-blue-950/30 border-b border-blue-800/50">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-white rounded-lg flex items-center justify-center text-blue-900 font-bold text-xl shadow-inner flex-shrink-0">
                    S
                </div>
                <div>
                    <h2 class="text-sm font-bold tracking-wider leading-tight">SPENSA</h2>
                    <p class="text-[10px] text-blue-200 uppercase tracking-widest">Presensi Digital</p>
                </div>
            </div>
            <!-- Close button for mobile -->
            <button @click="sidebarOpen = false" class="lg:hidden p-2 rounded-md text-blue-200 hover:text-white hover:bg-white/10 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <!-- Sidebar Navigation -->
        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-6 sidebar-scroll">
            
            <!-- Menu untuk Guru -->
            <template x-if="user.role === 'guru'">
                <div class="space-y-6">
                    
                    <!-- Menu Utama -->
                    <div>
                        <p class="px-3 text-xs font-semibold text-blue-300 uppercase tracking-wider mb-2">Menu Utama</p>
                        <div class="space-y-1">
                            <a @click.prevent="navigate('dashboard-guru')" href="#" :class="page === 'dashboard-guru' ? 'bg-blue-950/50 text-white relative before:absolute before:left-0 before:top-2 before:bottom-2 before:w-1.5 before:bg-blue-400 before:rounded-r-full shadow-inner' : 'text-blue-100 hover:bg-white/10 hover:text-white'" class="flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-medium transition-all min-h-[44px]">
                                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                                Dashboard
                            </a>
                        </div>
                    </div>

                    <!-- Master Data -->
                    <div>
                        <p class="px-3 text-xs font-semibold text-blue-300 uppercase tracking-wider mb-2">Master Data</p>
                        <div class="space-y-1">
                            <a @click.prevent="navigate('data-kelas')" href="#" :class="page === 'data-kelas' ? 'bg-blue-950/50 text-white relative before:absolute before:left-0 before:top-2 before:bottom-2 before:w-1.5 before:bg-blue-400 before:rounded-r-full shadow-inner' : 'text-blue-100 hover:bg-white/10 hover:text-white'" class="flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-medium transition-all min-h-[44px]">
                                <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                                Data Kelas
                            </a>
                            <a @click.prevent="navigate('data-siswa')" href="#" :class="page === 'data-siswa' ? 'bg-blue-950/50 text-white relative before:absolute before:left-0 before:top-2 before:bottom-2 before:w-1.5 before:bg-blue-400 before:rounded-r-full shadow-inner' : 'text-blue-100 hover:bg-white/10 hover:text-white'" class="flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-medium transition-all min-h-[44px]">
                                <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                                Data Siswa
                            </a>
                        </div>
                    </div>

                    <!-- Presensi & Akademik -->
                    <div>
                        <p class="px-3 text-xs font-semibold text-blue-300 uppercase tracking-wider mb-2">Presensi & Akademik</p>
                        <div class="space-y-1">
                            <a @click.prevent="navigate('absensi')" href="#" :class="page === 'absensi' ? 'bg-blue-950/50 text-white relative before:absolute before:left-0 before:top-2 before:bottom-2 before:w-1.5 before:bg-blue-400 before:rounded-r-full shadow-inner' : 'text-blue-100 hover:bg-white/10 hover:text-white'" class="flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-medium transition-all min-h-[44px]">
                                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                                Input Presensi
                            </a>
                            <a @click.prevent="navigate('penilaian-harian')" href="#" :class="page === 'penilaian-harian' ? 'bg-blue-950/50 text-white relative before:absolute before:left-0 before:top-2 before:bottom-2 before:w-1.5 before:bg-blue-400 before:rounded-r-full shadow-inner' : 'text-blue-100 hover:bg-white/10 hover:text-white'" class="flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-medium transition-all min-h-[44px]">
                                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                Input Nilai Keaktifan
                            </a>
                            <a @click.prevent="navigate('nilai')" href="#" :class="page === 'nilai' ? 'bg-blue-950/50 text-white relative before:absolute before:left-0 before:top-2 before:bottom-2 before:w-1.5 before:bg-blue-400 before:rounded-r-full shadow-inner' : 'text-blue-100 hover:bg-white/10 hover:text-white'" class="flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-medium transition-all min-h-[44px]">
                                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                Input Nilai Akhir
                            </a>
                            <a @click.prevent="navigate('ujian')" href="#" :class="page === 'ujian' || page.startsWith('ujian/') ? 'bg-blue-950/50 text-white relative before:absolute before:left-0 before:top-2 before:bottom-2 before:w-1.5 before:bg-blue-400 before:rounded-r-full shadow-inner' : 'text-blue-100 hover:bg-white/10 hover:text-white'" class="flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-medium transition-all min-h-[44px]">
                                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                                Ujian Harian
                            </a>
                            <a @click.prevent="navigate('hasil-ujian')" href="#" :class="page === 'hasil-ujian' || page.startsWith('hasil-ujian/') ? 'bg-blue-950/50 text-white relative before:absolute before:left-0 before:top-2 before:bottom-2 before:w-1.5 before:bg-blue-400 before:rounded-r-full shadow-inner' : 'text-blue-100 hover:bg-white/10 hover:text-white'" class="flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-medium transition-all min-h-[44px]">
                                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                Hasil & Koreksi Ujian
                            </a>
                        </div>
                    </div>

                    <!-- Konten -->
                    <div>
                        <p class="px-3 text-xs font-semibold text-blue-300 uppercase tracking-wider mb-2">Konten</p>
                        <div class="space-y-1">
                            <a @click.prevent="navigate('materi')" href="#" :class="page === 'materi' ? 'bg-blue-950/50 text-white relative before:absolute before:left-0 before:top-2 before:bottom-2 before:w-1.5 before:bg-blue-400 before:rounded-r-full shadow-inner' : 'text-blue-100 hover:bg-white/10 hover:text-white'" class="flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-medium transition-all min-h-[44px]">
                                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                                Materi Belajar
                            </a>
                            <a @click.prevent="navigate('artikel')" href="#" :class="page === 'artikel' ? 'bg-blue-950/50 text-white relative before:absolute before:left-0 before:top-2 before:bottom-2 before:w-1.5 before:bg-blue-400 before:rounded-r-full shadow-inner' : 'text-blue-100 hover:bg-white/10 hover:text-white'" class="flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-medium transition-all min-h-[44px]">
                                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path></svg>
                                Artikel Web
                            </a>
                        </div>
                    </div>

                    <!-- Laporan & Pengaturan -->
                    <div>
                        <p class="px-3 text-xs font-semibold text-blue-300 uppercase tracking-wider mb-2">Laporan & Pengaturan</p>
                        <div class="space-y-1">
                            <!-- Dropdown Laporan -->
                            <div x-data="{ openLaporan: page === 'rekap-absensi' }" class="space-y-1">
                                <button @click="openLaporan = !openLaporan" :class="page === 'rekap-absensi' ? 'bg-blue-950/50 text-white relative before:absolute before:left-0 before:top-2 before:bottom-2 before:w-1.5 before:bg-blue-400 before:rounded-r-full shadow-inner' : 'text-blue-100 hover:bg-white/10 hover:text-white'" class="w-full flex items-center justify-between px-3 py-3 rounded-xl text-sm font-medium transition-all min-h-[44px]">
                                    <div class="flex items-center gap-3">
                                        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                        Laporan
                                    </div>
                                    <svg :class="openLaporan ? 'rotate-180' : ''" class="w-4 h-4 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                </button>
                                
                                <!-- Sub menu Laporan -->
                                <div x-show="openLaporan" x-collapse class="pl-11 pr-3 py-1 space-y-1">
                                    <a @click.prevent="navigate('rekap-absensi')" href="#" :class="page === 'rekap-absensi' ? 'text-white bg-white/10 font-semibold' : 'text-blue-200 hover:text-white hover:bg-white/5'" class="block px-3 py-2 rounded-lg text-sm transition-colors">
                                        Rekap Presensi
                                    </a>
                                </div>
                            </div>
                            <a @click.prevent="navigate('pengaturan')" href="#" :class="page === 'pengaturan' ? 'bg-blue-950/50 text-white relative before:absolute before:left-0 before:top-2 before:bottom-2 before:w-1.5 before:bg-blue-400 before:rounded-r-full shadow-inner' : 'text-blue-100 hover:bg-white/10 hover:text-white'" class="flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-medium transition-all min-h-[44px]">
                                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                Pengaturan Web
                            </a>
                        </div>
                    </div>
                </div>
            </template>
            
            <template x-if="user.role === 'siswa'">
                <div>
                    <!-- Menu Siswa -->
                    <p class="px-3 text-xs font-semibold text-blue-300 uppercase tracking-wider mb-2">Menu Siswa</p>
                    <div class="space-y-1">
                        <a @click.prevent="navigate('dashboard-siswa')" href="#" :class="page === 'dashboard-siswa' ? 'bg-blue-950/50 text-white relative before:absolute before:left-0 before:top-2 before:bottom-2 before:w-1.5 before:bg-blue-400 before:rounded-r-full shadow-inner' : 'text-blue-100 hover:bg-white/10 hover:text-white'" class="flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-medium transition-all min-h-[44px]">
                            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                            Dashboard Siswa
                        </a>

                        <a @click.prevent="navigate('kehadiran-saya')" href="#" :class="page === 'kehadiran-saya' ? 'bg-blue-950/50 text-white relative before:absolute before:left-0 before:top-2 before:bottom-2 before:w-1.5 before:bg-blue-400 before:rounded-r-full shadow-inner' : 'text-blue-100 hover:bg-white/10 hover:text-white'" class="flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-medium transition-all min-h-[44px]">
                            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                            Kehadiran Saya
                        </a>

                        <a @click.prevent="navigate('ujian-siswa')" href="#" :class="page === 'ujian-siswa' ? 'bg-blue-950/50 text-white relative before:absolute before:left-0 before:top-2 before:bottom-2 before:w-1.5 before:bg-blue-400 before:rounded-r-full shadow-inner' : 'text-blue-100 hover:bg-white/10 hover:text-white'" class="flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-medium transition-all min-h-[44px]">
                            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                            Ujian Online (CBT)
                        </a>
                    </div>
                </div>
            </template>

        </nav>
    </div>

    <!-- Main Content Wrapper -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden relative w-full lg:w-auto transition-all duration-300">
        
        <!-- Header Atas Navbar -->
        <header class="h-[60px] bg-white border-b border-slate-200 flex items-center justify-between px-4 sm:px-6 flex-shrink-0 shadow-sm z-30 relative">
            <div class="flex items-center gap-4">
                <button @click="sidebarOpen = true" class="p-2 -ml-2 rounded-xl text-slate-500 hover:bg-slate-100 lg:hidden focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <h1 class="text-lg font-bold text-slate-800 tracking-tight truncate">Dashboard</h1>
            </div>
            
            <div class="flex items-center gap-3">
                <div class="hidden sm:block text-xs font-medium text-slate-500 bg-slate-100 px-3 py-1.5 rounded-full border border-slate-200" x-text="todayDate">
                </div>
                
                <!-- Dropdown Profile User di Navbar (Pojok Kanan Atas) -->
                <div class="relative">
                    <button @click="userMenuOpen = !userMenuOpen" @click.outside="userMenuOpen = false" class="flex items-center gap-2 p-1 rounded-full hover:bg-slate-100 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500/20">
                        <img :src="`https://ui-avatars.com/api/?name=${encodeURIComponent(user.name || 'U')}&background=1e40af&color=fff`" class="w-9 h-9 rounded-full object-cover border-2 border-blue-500 shadow-sm" alt="Avatar">
                        <span class="hidden md:inline-block font-semibold text-slate-700 text-sm" x-text="user.name"></span>
                        <svg class="w-4 h-4 text-slate-500 hidden md:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>

                    <!-- Dropdown Menu -->
                    <div x-cloak x-show="userMenuOpen" 
                         x-transition:enter="transition ease-out duration-100"
                         x-transition:enter-start="transform opacity-0 scale-95"
                         x-transition:enter-end="transform opacity-100 scale-100"
                         x-transition:leave="transition ease-in duration-75"
                         x-transition:leave-start="transform opacity-100 scale-100"
                         x-transition:leave-end="transform opacity-0 scale-95"
                         class="absolute right-0 mt-2 w-56 bg-white rounded-xl shadow-xl border border-slate-100 py-2 z-50">
                        
                        <!-- Profile Header -->
                        <div class="px-4 py-3 border-b border-slate-100 bg-slate-50/50">
                            <p class="text-sm font-bold text-slate-800 truncate" x-text="user.name"></p>
                            <span class="inline-block mt-1 px-2 py-0.5 text-[10px] font-semibold text-blue-700 bg-blue-50 rounded-full capitalize" x-text="user.role">
                            </span>
                        </div>

    <script>
        function appController() {
            return {
                sidebarOpen: false,
                userMenuOpen: false,
                page: '<?= page ?>',
                user: JSON.parse(localStorage.getItem('spensa_user') || '{}'),
                todayDate: new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }),
                
                init() {
                    // Ambil token dari URL jika ada
                    const urlParams = new URLSearchParams(window.location.search);
                    const urlToken = urlParams.get('token');
                    if (urlToken) {
                        localStorage.setItem('spensa_token', urlToken);
                    }

                    // Cek jika tidak ada sesi di localStorage
                    if (!this.user || !this.user.role) {
                        window.top.location.href = "<?= scriptUrl ?>?page=login";
                    }
                },
                
                navigate(targetPage) {
                    const token = localStorage.getItem('spensa_token') || '';
                    window.top.location.href = "<?= scriptUrl ?>?page=" + targetPage + "&token=" + token;
                },
                
                doLogout() {
                    localStorage.removeItem('spensa_token');
                    localStorage.removeItem('spensa_user');
                    window.top.location.href = "<?= scriptUrl ?>?page=login";
                }
            }
        }
    </script>
